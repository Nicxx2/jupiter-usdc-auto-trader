name: jupiter-usdc-auto-trader

x-default-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required and must remain stable}
      POSTGRES_DB: n8n
    volumes:
    - type: volume
      source: postgres_data
      target: /var/lib/postgresql/data
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U n8n -d n8n
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
    - n8n_db
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.31.6@sha256:3c07c723326dd72e46a6969181c66a75260b7a204b9b77ba1ece6d594489c684
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required and must remain stable}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required and must remain stable}
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required and must remain stable}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      GENERIC_TIMEZONE: ${TZ:-Europe/London}
      TZ: ${TZ:-Europe/London}
      INTERNAL_N8N_OWNER_PASSWORD_HASH: $$2a$$12$$ES9vjAtv3SGlbU5HKkBf7eB8FTAC/KTVUgVirYv.bdp2BGBLrv0Ui
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
    volumes:
    - type: volume
      source: n8n_data
      target: /home/node/.n8n
      volume:
        nocopy: true
    - type: volume
      source: bootstrap_data
      target: /bootstrap
      volume:
        nocopy: true
    depends_on:
      postgres:
        condition: service_healthy
      n8n-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - n8n_db
    - n8n_runners
    - trading_control
    entrypoint:
    - tini
    - --
    - /bin/sh
    - -c
    command:
    - |
      set -eu

      # Only a genuinely fresh n8n data directory gets the hidden bootstrap owner.
      # Existing installations keep their existing owner account untouched.
      if [ ! -f /home/node/.n8n/config ]; then
        echo "[n8n-supervisor] fresh data directory: provisioning internal bootstrap owner"
        export N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
        export N8N_INSTANCE_OWNER_EMAIL="jupiter-auto-trader@localhost.invalid"
        export N8N_INSTANCE_OWNER_FIRST_NAME="Jupiter"
        export N8N_INSTANCE_OWNER_LAST_NAME="Auto Trader"
        export N8N_INSTANCE_OWNER_PASSWORD_HASH="$$INTERNAL_N8N_OWNER_PASSWORD_HASH"
      else
        echo "[n8n-supervisor] existing n8n data detected: preserving existing owner settings"
      fi

      child=""
      pending_ack=""

      stop_child() {
        if [ -z "$$child" ]; then
          return 0
        fi

        if kill -0 "$$child" 2>/dev/null; then
          echo "[n8n-supervisor] stopping n8n PID $$child"
          kill -TERM "$$child" 2>/dev/null || true

          i=0
          while kill -0 "$$child" 2>/dev/null && [ "$$i" -lt 20 ]; do
            sleep 1
            i=$$((i + 1))
          done

          if kill -0 "$$child" 2>/dev/null; then
            echo "[n8n-supervisor] n8n did not stop after 20s; forcing stop"
            kill -KILL "$$child" 2>/dev/null || true
          fi

          wait "$$child" 2>/dev/null || true
        fi

        child=""
      }

      trap 'stop_child; exit 0' TERM INT

      while true; do
        n8n &
        child=$$!
        echo "[n8n-supervisor] n8n started as PID $$child"

        if [ -n "$$pending_ack" ]; then
          printf '%s' "$$pending_ack" > /bootstrap/restart.ack
          pending_ack=""
        fi

        restart_requested=0

        while kill -0 "$$child" 2>/dev/null; do
          if [ -f /bootstrap/restart.request ]; then
            pending_ack="$$(cat /bootstrap/restart.request 2>/dev/null || true)"
            rm -f /bootstrap/restart.request
            restart_requested=1
            echo "[n8n-supervisor] workflow/bootstrap restart requested"
            stop_child
            break
          fi
          sleep 1
        done

        if [ -n "$$child" ]; then
          wait "$$child" 2>/dev/null || true
          child=""
        fi

        if [ "$$restart_requested" -eq 1 ]; then
          echo "[n8n-supervisor] restarting n8n so published workflow becomes active"
        else
          echo "[n8n-supervisor] n8n exited; restarting"
        fi

        sleep 2
      done
  n8n-runner:
    image: n8nio/runners:2.31.6@sha256:fd1c233abcbcc45a5a376132b2d48457e9eaab3c48d642eb276a314d2e4e67ed
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN is required and must remain stable}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    depends_on:
      n8n-bootstrap:
        condition: service_completed_successfully
      n8n:
        condition: service_healthy
    networks:
    - n8n_runners
  trading-controller:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    restart: unless-stopped
    logging: *default-logging
    init: true
    entrypoint:
    - node
    - -e
    command:
    - |
      const http = require('http');
      const fs = require('fs');
      const crypto = require('crypto');
      const { URL, URLSearchParams } = require('url');

      const ADMIN_PORT = Number(process.env.ADMIN_PORT || 5680);
      const INTERNAL_PORT = Number(process.env.INTERNAL_PORT || 8080);
      const APP_API_PORT = String(process.env.APP_API_PORT || '8000').trim();
      const APP_API_URL_OVERRIDE = String(process.env.APP_API_URL || '').trim();
      const APP_API = resolveAppApiUrl(APP_API_URL_OVERRIDE, APP_API_PORT);
      const DASHBOARD_COOKIE_SECURE = parseEnvBoolean('DASHBOARD_COOKIE_SECURE', process.env.DASHBOARD_COOKIE_SECURE || 'false');
      const N8N_WEBHOOK = process.env.N8N_ALERT_WEBHOOK || 'http://n8n:5678/webhook/jupiter-ntfy-event';
      const N8N_HEALTH = process.env.N8N_HEALTH_URL || 'http://n8n:5678/healthz';
      const GATEWAY = (process.env.GATEWAY_URL || 'http://gateway:15888').replace(/\/+$$/, '');
      const RPC_CONFIGURATOR = (process.env.RPC_CONFIGURATOR_URL || 'http://rpc-configurator:8081').replace(/\/+$$/, '');
      const RPC_CONTROL_DIR = process.env.RPC_CONTROL_DIR || '/gateway-control';
      const RPC_TOKEN_FILE = `$${RPC_CONTROL_DIR}/rpc-config-token`;
      const RPC_RESTART_ACK_FILE = `$${RPC_CONTROL_DIR}/restart.ack`;
      const NTFY = resolveNtfyServer(process.env.NTFY_SERVER || 'https://ntfy.sh');
      const APP_VERSION = '10.2.3';
      const NETWORK = process.env.SOLANA_NETWORK || 'mainnet-beta';
      const TOPIC_REFRESH_MS = Number(process.env.TOPIC_REFRESH_SECONDS || 15) * 1000;
      const LOOKBACK = process.env.NTFY_LOOKBACK || '5m';
      const DATA_DIR = '/data';
      const STATE_FILE = `$${DATA_DIR}/state.json`;
      const AUTH_FILE = `$${DATA_DIR}/auth.json`;
      const SEEN_FILE = `$${DATA_DIR}/seen.json`;
      const TRADES_FILE = `$${DATA_DIR}/trades.json`;
      const AUDIT_FILE = `$${DATA_DIR}/audit.json`;
      const TRIGGER_GUARDS_FILE = `$${DATA_DIR}/trigger-guards.json`;
      const MAX_SEEN = 3000;
      const MAX_TRADES = 500;
      const MAX_AUDIT = 1000;
      const USDC_MINT = 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
      const WRAPPED_SOL_MINT = 'So11111111111111111111111111111111111111112';

      fs.mkdirSync(DATA_DIR, { recursive: true });

      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const nowIso = () => new Date().toISOString();

      function parseEnvBoolean(name, value) {
        const normalized=String(value??'').trim().toLowerCase();
        if(['1','true','yes','on'].includes(normalized))return true;
        if(['0','false','no','off',''].includes(normalized))return false;
        throw new Error(`$${name} must be true or false`);
      }

      function isContainerLoopbackHost(rawHost) {
        const host=String(rawHost||'').toLowerCase().replace(/\.+$$/,'');
        const mappedIpv4Loopback=/^\[::ffff:(?:0:)?7f[0-9a-f]{2}:/.test(host);
        return ['localhost','0.0.0.0','::','[::]','::1','[::1]','[::ffff:0:0]'].includes(host) ||
          host.endsWith('.localhost') || host.startsWith('127.') || mappedIpv4Loopback;
      }

      function resolveAppApiUrl(fullUrl, portRaw) {
        const override=String(fullUrl||'').trim();
        if(!override){
          const raw=String(portRaw||'').trim();
          if(!/^\d{1,5}$$/.test(raw))throw new Error('APP_API_PORT must be a whole number from 1 to 65535');
          const port=Number(raw);
          if(!Number.isInteger(port)||port<1||port>65535)throw new Error('APP_API_PORT must be from 1 to 65535');
          return `http://host.docker.internal:$${port}/api/tokens`;
        }

        let u;
        try{u=new URL(override);}catch{throw new Error('APP_API_URL must be a complete http:// or https:// URL ending in /api/tokens');}
        if(!['http:','https:'].includes(u.protocol))throw new Error('APP_API_URL must use http:// or https://');
        if(u.username||u.password)throw new Error('APP_API_URL must not contain embedded credentials');
        if(u.hash)throw new Error('APP_API_URL must not contain a URL fragment');
        if(u.search)throw new Error('APP_API_URL must not contain query parameters or API keys');
        if(isContainerLoopbackHost(u.hostname))
          throw new Error('APP_API_URL localhost/loopback would point at this container; use APP_API_PORT for the same Docker host');
        if(u.port==='0')throw new Error('APP_API_URL port must be from 1 to 65535');
        const path=u.pathname.replace(/\/+$$/,'');
        if(!path.endsWith('/api/tokens'))throw new Error('APP_API_URL must end in /api/tokens');
        u.pathname=path;
        return u.toString();
      }

      function resolveNtfyServer(raw) {
        let u;
        try{u=new URL(String(raw||'').trim());}catch{throw new Error('NTFY_SERVER must be a complete http:// or https:// base URL');}
        if(!['http:','https:'].includes(u.protocol))throw new Error('NTFY_SERVER must use http:// or https://');
        if(!u.hostname)throw new Error('NTFY_SERVER hostname is missing');
        if(u.username||u.password)throw new Error('NTFY_SERVER must not contain embedded credentials');
        if(u.search||u.hash)throw new Error('NTFY_SERVER must not contain a query string or fragment');
        if(isContainerLoopbackHost(u.hostname))
          throw new Error('NTFY_SERVER localhost/loopback would point at this container; use host.docker.internal for ntfy on the same Docker host');
        if(u.port==='0')throw new Error('NTFY_SERVER port must be from 1 to 65535');
        u.pathname=u.pathname.replace(/\/+$$/,'');
        return u.toString().replace(/\/+$$/,'');
      }

      function atomicJson(path, value) {
        const tmp = `$${path}.tmp`;
        fs.writeFileSync(tmp, JSON.stringify(value, null, 2), { mode: 0o600 });
        fs.renameSync(tmp, path);
      }
      function readJson(path, fallback) {
        try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
        catch (e) {
          if (e?.code === 'ENOENT') return fallback;
          throw new Error(`Cannot read persisted controller state $${path}: $${e.message}`);
        }
      }
      function boundedPush(arr, value, max) {
        arr.push(value);
        if (arr.length > max) arr.splice(0, arr.length - max);
      }
      function html(v) {
        return String(v ?? '')
          .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      }

      function formatBalance(value, decimals=8) {
        const n=Number(value);
        if(!Number.isFinite(n)) return '—';
        if(n===0) return '0';
        const abs=Math.abs(n);
        if(abs<0.000001) return n.toPrecision(6).replace(/\.?0+e/,'e');
        return n.toLocaleString('en-GB',{maximumFractionDigits:decimals,useGrouping:true});
      }
      function formatPrice(value) {
        const n=Number(value);
        if(!Number.isFinite(n)) return '—';
        if(n===0) return '0';
        if(Math.abs(n)<0.0001) return n.toFixed(10).replace(/0+$$/,'').replace(/\.$$/,'');
        return n.toLocaleString('en-GB',{maximumFractionDigits:8,useGrouping:false});
      }
      function b64url(buf) { return Buffer.from(buf).toString('base64url'); }
      function b64urlDecode(v) { return Buffer.from(v, 'base64url'); }
      function base58Encode(buf) {
        const alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
        const bytes = Buffer.from(buf);
        let zeros = 0;
        while (zeros < bytes.length && bytes[zeros] === 0) zeros++;
        let n = 0n;
        for (const b of bytes) n = (n << 8n) + BigInt(b);
        let s = '';
        while (n > 0n) {
          const r = Number(n % 58n);
          n /= 58n;
          s = alphabet[r] + s;
        }
        return '1'.repeat(zeros) + (s || (zeros ? '' : '1'));
      }
      function isMint(v) { return /^[1-9A-HJ-NP-Za-km-z]{32,44}$$/.test(String(v || '')); }
      function isSolanaSignature(v) { return /^[1-9A-HJ-NP-Za-km-z]{64,100}$$/.test(String(v || '')); }
      function isPlainObject(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
      function hasOwn(obj, key) { return Object.prototype.hasOwnProperty.call(obj, key); }
      function persistedSchemaError(path, detail) {
        throw new Error(`Persisted controller state $${path} $${detail}; restore a known-good controller_data backup`);
      }
      function validatePersistedState(path, value) {
        if (!isPlainObject(value)) persistedSchemaError(path, 'must contain a JSON object');

        if (hasOwn(value, 'mode') && !['testing','trading'].includes(value.mode))
          persistedSchemaError(path, 'has an invalid mode');
        if (hasOwn(value, 'master') && typeof value.master !== 'boolean')
          persistedSchemaError(path, 'has a non-boolean MASTER value');
        if (hasOwn(value, 'safetyLock') && typeof value.safetyLock !== 'boolean')
          persistedSchemaError(path, 'has a non-boolean safety lock');
        if (hasOwn(value, 'safetyReason') && value.safetyReason !== null && typeof value.safetyReason !== 'string')
          persistedSchemaError(path, 'has an invalid safety-lock reason');
        if (hasOwn(value, 'requirePrivateTradingTopic') && typeof value.requirePrivateTradingTopic !== 'boolean')
          persistedSchemaError(path, 'has an invalid private-topic policy');
        if (hasOwn(value, 'burstPolicy') && !['collapse','every-alert'].includes(value.burstPolicy))
          persistedSchemaError(path, 'has an invalid burst policy');
        if (hasOwn(value, 'selectedWallet') && value.selectedWallet !== null && !isMint(value.selectedWallet))
          persistedSchemaError(path, 'has an invalid selected wallet');
        if (hasOwn(value, 'tradingNtfyTopic') && value.tradingNtfyTopic !== null &&
            !/^trade-[-_A-Za-z0-9]{32,60}$$/.test(String(value.tradingNtfyTopic)))
          persistedSchemaError(path, 'has an invalid private Trading Topic');
        if (hasOwn(value, 'lastReadiness') && value.lastReadiness !== null && !isPlainObject(value.lastReadiness))
          persistedSchemaError(path, 'has an invalid readiness snapshot');

        const numericRules = [
          ['minSolReserve', 0, Number.POSITIVE_INFINITY, false],
          ['slippagePct', 0, 10, false],
          ['maxPriceImpactPct', 0.1, 25, false],
          ['maxTradeUSDC', 1, 1000000, false],
          ['burstWindowSec', 5, 300, true],
        ];
        for (const [key, min, max, integer] of numericRules) {
          if (!hasOwn(value, key)) continue;
          const n=value[key];
          if (typeof n !== 'number' || !Number.isFinite(n) || n < min || n > max || (integer && !Number.isInteger(n)))
            persistedSchemaError(path, `has an invalid $${key}`);
        }

        for (const mapName of ['tokens','walletBackups','walletMeta']) {
          if (hasOwn(value, mapName) && !isPlainObject(value[mapName]))
            persistedSchemaError(path, `has an invalid $${mapName} map`);
        }
        for (const [mint, control] of Object.entries(value.tokens || {})) {
          if (!isMint(mint) || !isPlainObject(control) ||
              (hasOwn(control, 'autoBuy') && typeof control.autoBuy !== 'boolean') ||
              (hasOwn(control, 'autoSell') && typeof control.autoSell !== 'boolean') ||
              (hasOwn(control, 'wallet') && control.wallet !== null && !isMint(control.wallet)))
            persistedSchemaError(path, `has invalid automation controls for $${mint}`);
        }
        for (const [address, confirmed] of Object.entries(value.walletBackups || {})) {
          if (!isMint(address) || typeof confirmed !== 'boolean')
            persistedSchemaError(path, `has invalid wallet-backup evidence for $${address}`);
        }
        for (const [address, meta] of Object.entries(value.walletMeta || {})) {
          if (!isMint(address) || !isPlainObject(meta) ||
              (hasOwn(meta, 'nickname') && typeof meta.nickname !== 'string') ||
              (hasOwn(meta, 'createdAt') && meta.createdAt !== null && typeof meta.createdAt !== 'string'))
            persistedSchemaError(path, `has invalid wallet metadata for $${address}`);
        }
      }
      function validatePersistedAuth(path, value) {
        if (!isPlainObject(value) || !/^[a-f0-9]{64}$$/.test(String(value.salt || '')) ||
            !/^[a-f0-9]{128}$$/.test(String(value.hash || '')) ||
            !/^[a-f0-9]{64}$$/.test(String(value.sessionSecret || '')) ||
            !Number.isInteger(value.sessionVersion) || value.sessionVersion < 1 ||
            typeof value.mustChange !== 'boolean') {
          throw new Error(`Persisted controller authentication $${path} has an invalid schema; use the documented stopped-stack password recovery or restore controller_data`);
        }
      }
      function validatePersistedCollections() {
        if (!Array.isArray(seenList) || seenList.some(id => typeof id !== 'string' || !id || id.length > 128))
          persistedSchemaError(SEEN_FILE, 'must contain only non-empty alert ID strings');
        const tradeStatuses=new Set(['SUBMITTING','PENDING','CONFIRMED','FAILED','UNCERTAIN','REVIEWED']);
        if (!Array.isArray(trades) || trades.some(row => !isPlainObject(row) ||
            typeof row.at !== 'string' || !Number.isFinite(Date.parse(row.at)) ||
            typeof row.alertId !== 'string' || !row.alertId || row.alertId.length > 128 || !isMint(row.mint) ||
            !['BUY','SELL'].includes(row.direction) || !tradeStatuses.has(row.status) || !isMint(row.wallet) ||
            typeof row.target !== 'number' || !Number.isFinite(row.target) || row.target <= 0 ||
            typeof row.usdAmount !== 'number' || !Number.isFinite(row.usdAmount) || row.usdAmount <= 0))
          persistedSchemaError(TRADES_FILE, 'contains an invalid durable trade record');
        if (!Array.isArray(audit) || audit.some(row => !isPlainObject(row) ||
            typeof row.at !== 'string' || !Number.isFinite(Date.parse(row.at)) || typeof row.kind !== 'string' || !row.kind))
          persistedSchemaError(AUDIT_FILE, 'contains an invalid audit record');
        if (!isPlainObject(triggerGuards) || Object.entries(triggerGuards).some(([key,row]) => !isPlainObject(row) ||
            typeof row.at !== 'string' || !Number.isFinite(Date.parse(row.at)) || typeof row.alertId !== 'string' || !row.alertId || row.alertId.length > 128 ||
            !isMint(row.mint) || !['BUY','SELL'].includes(row.direction) ||
            typeof row.target !== 'number' || !Number.isFinite(row.target) || row.target <= 0 ||
            typeof row.resetMinutes !== 'number' || !Number.isFinite(row.resetMinutes) || row.resetMinutes < 0 ||
            key !== `$${row.mint}|$${row.direction}|$${Number(row.target).toPrecision(16)}`))
          persistedSchemaError(TRIGGER_GUARDS_FILE, 'contains an invalid trigger-guard record');
      }
      function approx(a, b, rel = 1e-9, abs = 1e-12) {
        a = Number(a); b = Number(b);
        return Number.isFinite(a) && Number.isFinite(b) &&
          Math.abs(a - b) <= Math.max(abs, Math.abs(b) * rel);
      }

      function priceImpactPercent(raw) {
        return typeof raw === 'number' && Number.isFinite(raw) && raw >= 0 ? raw*100 : null;
      }
      function impactWithinLimit(raw, maxPct=state.maxPriceImpactPct) {
        const pct=priceImpactPercent(raw);
        return pct !== null && Number.isFinite(Number(maxPct)) && pct <= Number(maxPct);
      }
      function requiredSolBalance(mint,direction,amountIn,minReserve) {
        if(typeof minReserve!=='number'||!Number.isFinite(minReserve)||minReserve<0)return Number.POSITIVE_INFINITY;
        if(direction==='SELL'&&mint===WRAPPED_SOL_MINT)
          return typeof amountIn==='number'&&Number.isFinite(amountIn)&&amountIn>0?minReserve+amountIn:Number.POSITIVE_INFINITY;
        return minReserve;
      }
      function isDefaultPublicSolanaRpc(url) {
        const s=String(url||'').trim().toLowerCase().replace(/\/+$$/,'');
        return !s || s === 'https://api.mainnet-beta.solana.com' || s === 'http://api.mainnet-beta.solana.com';
      }

      function redactRpcUrl(raw){
        try{
          const u=new URL(String(raw||''));
          if(u.username)u.username='***';
          if(u.password)u.password='***';
          if(u.pathname&&u.pathname!=='/')u.pathname='/***';
          if([...u.searchParams.keys()].length){
            for(const k of [...u.searchParams.keys()])u.searchParams.set(k,'***');
          }
          return u.toString();
        }catch{return raw?'configured':'—';}
      }
      function classifyRpcUrl(raw){
        try{
          const u=new URL(String(raw||''));
          const host=u.hostname.toLowerCase().replace(/\.+$$/,'');
          if(host==='api.mainnet-beta.solana.com')return 'public';
          if(host.endsWith('helius-rpc.com'))return 'helius';
          return raw?'custom':'unknown';
        }catch{return 'unknown';}
      }
      function rpcAccessToken(){
        try{return fs.readFileSync(RPC_TOKEN_FILE,'utf8').trim();}catch{return '';}
      }
      async function rpcManager(path,opts={},timeout=15000){
        const token=rpcAccessToken();
        if(!token)throw new Error('RPC configurator authentication token is unavailable');
        return fetchJson(`$${RPC_CONFIGURATOR}$${path}`,{
          ...opts,
