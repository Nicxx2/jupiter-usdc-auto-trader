        const productionRpcOk=rpcKind==='helius'||rpcKind==='custom';
        const rpcDetail=rpcKind==='helius'
          ? 'Helius RPC active — suitable for Testing + Trading'
          : rpcKind==='custom'
            ? `Custom RPC active — $${redactRpcUrl(rpcUrl)}`
            : rpcKind==='public'
              ? 'Solana Public RPC active — Testing only; choose Helius or Custom before real trading'
              : 'RPC unavailable/unknown';
        add('productionRpc','Trading RPC',productionRpcOk,rpcDetail);

        try {
          docs = await gateway('/docs/json', {}, 8000);
          const c = requiredApiPathsPresent(docs);
          add('api', 'Gateway API compatibility', c.ok, c.ok ? `version $${docs?.info?.version || 'unknown'}` : `missing: $${c.missing.join(', ')}`);
        } catch (e) { add('api', 'Gateway API compatibility', false, e.message); }

        add('ntfy', 'ntfy listener', streamConnected && activeTopics.length > 0,
          streamConnected ? `$${activeTopics.length} topic(s): $${activeTopics.join(', ')}` : 'not connected');

        try {
          const q = await gateway(`/connectors/jupiter/router/quote-swap?network=$${encodeURIComponent(NETWORK)}&baseToken=SOL&quoteToken=USDC&amount=0.001&side=SELL&slippagePct=$${encodeURIComponent(state.slippagePct)}`, {}, 12000);
          add('quote', 'Jupiter/Gateway quote test', !!q?.quoteId && Number(q.amountOut) > 0,
            q?.amountOut ? `0.001 SOL → $${q.amountOut} USDC` : 'no quote');
        } catch (e) { add('quote', 'Jupiter/Gateway quote test', false, e.message); }

        add('password', 'Admin password changed', auth.mustChange !== true, auth.mustChange ? 'change the first-run password' : 'yes');
        add('safety', 'Safety lock clear', state.safetyLock !== true, state.safetyLock ? state.safetyReason || 'locked' : 'clear');
        add('rpcChange','RPC configuration idle',!rpcChangeLock,rpcChangeLock?'provider change/restart still in progress':'idle');

        try {
          wallets=await getWallets();
          walletAddresses=solanaWalletAddresses(wallets);
          add('walletInventory','Gateway Solana wallets',walletAddresses.length>0,
            walletAddresses.length ? `$${walletAddresses.length} wallet(s) available` : 'no Solana wallets');
        } catch(e) {
          add('walletInventory','Gateway Solana wallets',false,e.message);
        }

        const enabledAutos=(Array.isArray(app?.tokens)?app.tokens:[]).filter(t=>{
          const c=state.tokens[t.mint]||{};
          return t.enabled===true && (c.autoBuy===true || c.autoSell===true);
        });

        const sourceDirectionProblems=[];
        for(const t of enabledAutos){
          const c=state.tokens[t.mint]||{};
          if(c.autoBuy===true && (!Array.isArray(t.buy_alerts)||t.buy_alerts.length===0))
            sourceDirectionProblems.push(`$${t.name}: AUTO BUY is ON but no BUY target is configured in Jupiter Alerts`);
          if(c.autoSell===true && (!Array.isArray(t.sell_alerts)||t.sell_alerts.length===0))
            sourceDirectionProblems.push(`$${t.name}: AUTO SELL is ON but no SELL target is configured in Jupiter Alerts`);
        }
        add('sourceDirections','Source price-alert directions',sourceDirectionProblems.length===0,
          sourceDirectionProblems.length ? sourceDirectionProblems.join(' | ') :
            (enabledAutos.length ? 'Every enabled AUTO direction has at least one configured Jupiter Alerts target' : 'no auto-enabled directions yet'));

        const topicProblems=[];
        if(state.requirePrivateTradingTopic){
          for(const t of enabledAutos){
            const topic=currentEffectiveTopic(app,t.mint);
            if(topic!==state.tradingNtfyTopic){
              topicProblems.push(`$${t.name}: effective ntfy topic does not match the controller-generated Trading Topic`);
            }
          }
        }
        add('triggerSecurity','Trading trigger policy',topicProblems.length===0,
          state.requirePrivateTradingTopic
            ? (topicProblems.length ? topicProblems.join(' | ') :
                (enabledAutos.length ? `$${enabledAutos.length} auto-enabled coin(s) use the required private Trading Topic` : 'private Trading Topic required; no auto-enabled coins yet'))
            : 'Shared/custom ntfy topics allowed — exact full mint + current effective topic + target are still validated');

        const riskCapsOk=Number.isFinite(Number(state.minSolReserve)) && Number(state.minSolReserve)>=0.001 &&
          Number.isFinite(Number(state.maxPriceImpactPct)) && Number(state.maxPriceImpactPct)>0 &&
          Number(state.maxPriceImpactPct)<=25 && Number.isFinite(Number(state.maxTradeUSDC)) && Number(state.maxTradeUSDC)>0;
        add('riskCaps','Execution risk caps',riskCapsOk,
          `max impact $${state.maxPriceImpactPct}% · max trade $${state.maxTradeUSDC} USDC · slippage $${state.slippagePct}%`);

        const assignmentProblems=[];
        const assignedWallets=new Set();
        for(const t of enabledAutos){
          const c=state.tokens[t.mint]||{};
          const w=c.wallet||null;
          if(!w){assignmentProblems.push(`$${t.name}: no trading wallet assigned`);continue;}
          if(!walletAddresses.includes(w)){assignmentProblems.push(`$${t.name}: assigned wallet is not present in Gateway`);continue;}
          if(state.walletBackups[w]!==true){assignmentProblems.push(`$${t.name}: $${walletLabel(w)} recovery backup not confirmed`);continue;}
          assignedWallets.add(w);
        }
        add('assignments','Per-coin trading wallet assignments',assignmentProblems.length===0,
          assignmentProblems.length ? assignmentProblems.join(' | ') :
            (enabledAutos.length ? `$${enabledAutos.length} auto-enabled coin(s) have valid backed-up wallet assignments` : 'no auto-enabled coins yet'));

        const solProblems=[];
        for(const w of assignedWallets){
          try{
            const b=await getBalancesNormalized(w,null,null);
            if(Number(b.sol)<Number(state.minSolReserve)) solProblems.push(`$${walletLabel(w)}: $${b.sol} SOL < reserve $${state.minSolReserve}`);
          }catch(e){solProblems.push(`$${walletLabel(w)}: $${e.message}`);}
        }
        add('assignedSol','SOL reserve on assigned wallets',solProblems.length===0,
          solProblems.length ? solProblems.join(' | ') :
            (assignedWallets.size ? `$${assignedWallets.size} assigned wallet(s) meet reserve` : 'no assigned auto-trading wallets yet'));

        add('fundsPolicy','Trade-specific balance checks',true,'Exact assigned-wallet USDC/token balance is re-read immediately before every trade');

        const coreIds=['app','n8n','workflow','gateway','gatewayTokens','solana','api','ntfy','quote'];
        const tradingIds=[...coreIds,'password','safety','rpcChange','rpcManager','productionRpc','triggerSecurity','riskCaps','sourceDirections','walletInventory','assignments','assignedSol','fundsPolicy'];
        const coreOk=coreIds.every(id=>checks.find(c=>c.id===id)?.ok);
        const tradingOk=tradingIds.every(id=>checks.find(c=>c.id===id)?.ok);
        const result={at:nowIso(),coreOk,tradingOk,checks};
        state.lastReadiness=result;saveState();
        return result;
      }
      function healthyClass(ok) { return ok ? 'good' : 'bad'; }

      async function dashboard(req, session, notice = '') {
        let app = { tokens: [], summaries: [] }, wallets = [], balances = null;
        let appError = '', gatewayError = '', rpcError = '', rpcManagerInfo = null, solanaLive = null;
        try { app = await getApp(); syncTokenControls(app); } catch (e) { appError = e.message; }
        try { wallets = await getWallets(); } catch (e) { gatewayError = e.message; }
        try { rpcManagerInfo=await getRpcManagerStatus(); } catch(e) { rpcError=e.message; }
        try { solanaLive=await gateway(`/chains/solana/status?network=$${encodeURIComponent(NETWORK)}`,{},8000); } catch(e) { if(!gatewayError)gatewayError=e.message; }
        const addresses = solanaWalletAddresses(wallets);
        if (state.selectedWallet && addresses.includes(state.selectedWallet)) {
          try { balances = await getBalancesNormalized(state.selectedWallet, null, null); } catch {}
        }
        const summaries = Array.isArray(app.summaries) ? app.summaries : [];
        const sm = new Map(summaries.map(s => [s.mint, s]));
        const tokens = Array.isArray(app.tokens) ? app.tokens : [];
        const csrf = formHidden(session);
        const last = state.lastReadiness;
        const modeTrading = state.mode === 'trading';

        const rows = tokens.map(t => {
          const c = state.tokens[t.mint] || { autoBuy:false, autoSell:false, wallet:null };
          const s = sm.get(t.mint) || {};
          const buyTargets=Array.isArray(t.buy_alerts)?t.buy_alerts:[];
          const sellTargets=Array.isArray(t.sell_alerts)?t.sell_alerts:[];
          const buyConfigured=buyTargets.length>0;
          const sellConfigured=sellTargets.length>0;
          const walletOptions = `<option value="">— No wallet assigned —</option>` + addresses.map(a => {
            const label=`$${walletLabel(a)} — $${a.slice(0,6)}…$${a.slice(-6)}`;
            return `<option value="$${html(a)}" $${c.wallet===a?'selected':''}>$${html(label)}</option>`;
          }).join('');
          const assignmentStatus = c.wallet
            ? (addresses.includes(c.wallet)
                ? `$${state.walletBackups[c.wallet]===true?'✅':'⚠️'} $${html(walletLabel(c.wallet))}`
                : '❌ Assigned wallet missing from Gateway')
            : '⚪ Unassigned';
          return `<tr>
            <td><b>$${html(t.name)}</b><div class="mint">$${html(t.mint)}</div></td>
            <td>$${t.enabled ? '✅ Enabled' : '⛔ Disabled'}</td>
            <td>$${html(formatBalance(t.usd_amount,6))} USDC</td>
            <td>
              <small><b>BUY:</b> $${buyConfigured ? html(buyTargets.map(formatPrice).join(', ')) : '<span class="muted">No target</span>'}<br>
              <b>SELL:</b> $${sellConfigured ? html(sellTargets.map(formatPrice).join(', ')) : '<span class="muted">No target</span>'}</small>
            </td>
            <td><small>$${html(s.ntfy_effective_topic || t.ntfy_topic || '—')}</small></td>
            <td><select name="wallet_$${html(t.mint)}">$${walletOptions}</select><div class="muted" style="margin-top:5px">$${assignmentStatus}</div></td>
            <td>
              <label title="$${buyConfigured?'Triggered only by a fresh Jupiter BUY ntfy alert':'Configure a BUY target in Jupiter Alerts first'}">
                <input type="checkbox" name="autoBuy_$${html(t.mint)}" $${c.autoBuy ? 'checked' : ''} $${t.enabled&&buyConfigured ? '' : 'disabled'}> AUTO BUY
              </label>
              $${buyConfigured?'':'<small class="muted"> · no BUY target</small>'}<br>
              <label title="$${sellConfigured?'Triggered only by a fresh Jupiter SELL ntfy alert':'Configure a SELL target in Jupiter Alerts first'}">
                <input type="checkbox" name="autoSell_$${html(t.mint)}" $${c.autoSell ? 'checked' : ''} $${t.enabled&&sellConfigured ? '' : 'disabled'}> AUTO SELL
              </label>
              $${sellConfigured?'':'<small class="muted"> · no SELL target</small>'}
            </td>
          </tr>`;
        }).join('');

        let balanceRows = '';
        if (state.selectedWallet) {
          try {
            const reqTokens = ['SOL','USDC', ...tokens.map(t => t.mint)];
            const br = await gateway('/chains/solana/balances', {
              method:'POST', headers:{'content-type':'application/json'},
              body:JSON.stringify({network:NETWORK,address:state.selectedWallet,tokens:reqTokens})
            }, 15000);
            const raw = br?.balances || {};
            balanceRows += `<tr><td>SOL</td><td>$${html(formatBalance(raw.SOL ?? 0,9))}</td></tr>`;
            balanceRows += `<tr><td>USDC</td><td>$${html(formatBalance(raw.USDC ?? 0,6))}</td></tr>`;
            for (const t of tokens) {
              const val = raw[t.mint] ?? raw[t.name] ?? raw[String(t.name).toUpperCase()] ?? null;
              balanceRows += `<tr><td>$${html(t.name)}</td><td>$${html(val===null?'—':formatBalance(val,8))}</td></tr>`;
            }
          } catch (e) { balanceRows = `<tr><td colspan="2">Balance error: $${html(e.message)}</td></tr>`; }
        }

        const walletCards = addresses.map(a => {
          ensureWalletMeta(a);
          const selected = a === state.selectedWallet;
          const nick = cleanNickname(state.walletMeta[a]?.nickname);
          const backed = state.walletBackups[a] === true;
          const assignedCoins=tokens.filter(t=>state.tokens[t.mint]?.wallet===a).map(t=>t.name);
          return `<div class="walletcard $${selected?'selectedwallet':''}">
            <div><b>$${html(nick || 'Unnamed wallet')}</b> $${selected?'<span class="pill">VIEWING / DEFAULT</span>':''}</div>
            <div class="mint">$${html(a)}</div>
            <div style="margin:8px 0">Recovery backup: $${backed?'✅ confirmed':'❌ not confirmed'}</div>
            <div style="margin:8px 0">Assigned coins: <b>$${html(assignedCoins.join(', ') || 'None')}</b></div>
            <form method="post" action="/admin/wallet/rename" style="margin:6px 0">$${csrf}
              <input type="hidden" name="address" value="$${html(a)}">
              <input name="nickname" maxlength="40" value="$${html(nick)}" placeholder="Optional nickname">
              <button>Save name</button>
            </form>
            $${selected ? '' : `<form method="post" action="/admin/wallet/select" style="margin:6px 0">$${csrf}
              <input type="hidden" name="address" value="$${html(a)}">
              <button class="primary">View / make Gateway default</button>
            </form>`}
          </div>`;
        }).join('') || '<p>No Solana wallets in Gateway yet.</p>';

        const activeGuards = Object.entries(triggerGuards).filter(([,v])=>v && typeof v==='object');
        const autoEnabledTokens=tokens.filter(t=>{
          const c=state.tokens[t.mint]||{};
          return t.enabled===true&&(c.autoBuy===true||c.autoSell===true);
        });
        const tradingTopicRows=autoEnabledTokens.map(t=>{
          const current=String((sm.get(t.mint)||{}).ntfy_effective_topic||t.ntfy_topic||'');
          const ok=current===state.tradingNtfyTopic;
          return `<div class="check"><span>$${ok?'✅':'❌'} $${html(t.name)}</span><small>$${ok?'Trading Topic active':`Current: $${html(current||'none')}`}</small></div>`;
        }).join('') || '<p class="muted">No auto-enabled coins yet.</p>';
        const tradingTopicReady=!state.requirePrivateTradingTopic ||
          autoEnabledTokens.every(t=>String((sm.get(t.mint)||{}).ntfy_effective_topic||t.ntfy_topic||'')===state.tradingNtfyTopic);
        const triggerGuardHtml = activeGuards.length
          ? `<div class="banner warn"><b>$${activeGuards.length} live-trading trigger guard(s) armed.</b><br><small>These prevent the same price threshold being traded repeatedly. Timed guards expire from the reset period captured when the trade was attempted, unless that transaction is unresolved; other guards remain until an explicit reviewed reset.</small></div>`
          : '<p class="muted">No live-trading trigger guards are currently armed.</p>';

        const activeRpcKind=classifyRpcUrl(solanaLive?.rpcUrl);
        const activeRpcLabel=activeRpcKind==='helius'?'Helius':activeRpcKind==='custom'?'Custom RPC':activeRpcKind==='public'?'Solana Public':'Unknown';
        const activeRpcTradingReady=activeRpcKind==='helius'||activeRpcKind==='custom';
        const activeRpcDisplay=redactRpcUrl(solanaLive?.rpcUrl||rpcManagerInfo?.nodeURLRedacted||'');
        const readinessHtml = last ? last.checks.map(c =>
          `<div class="check"><span>$${c.ok ? '✅' : '❌'} $${html(c.label)}</span><small>$${html(c.detail)}</small></div>`
        ).join('') : '<p class="muted">Run Quick Test Everything to populate readiness.</p>';

        const tradesHtml = trades.slice(-10).reverse().map(t =>
          `<tr><td>$${html(t.at || t.updatedAt)}</td><td>$${html(t.name)}</td><td>$${html(t.direction)}</td><td>$${html(t.status)}</td><td>$${Number.isFinite(Number(t.priceImpactPercent))?html(Number(t.priceImpactPercent).toFixed(2)+'%'):'—'}</td><td class="mint">$${html(t.signature || '—')}</td></tr>`
        ).join('') || '<tr><td colspan="6"><div class="empty">No live trades yet.</div></td></tr>';

        const warning = auth.mustChange ? `<div class="banner bad">Change the first-run admin password before Trading Mode can be enabled.</div>` : '';
        const lock = state.safetyLock ? `<div class="banner bad"><b>SAFETY LOCK:</b> $${html(state.safetyReason || 'An uncertain transaction requires review.')}</div>` : '';

        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
      <title>Jupiter Auto Trader</title>
      <style>
      body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1217;color:#edf2f7;margin:0}
      .wrap{max-width:1200px;margin:26px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.version{display:inline-block;margin-left:8px;padding:3px 7px;border:1px solid #3a4656;border-radius:999px;color:#aeb9c7;font-size:12px;font-weight:600;vertical-align:middle}
      .card{background:#171b22;border:1px solid #2a313c;border-radius:14px;padding:18px;margin:14px 0}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start;grid-auto-rows:max-content}
      .banner{padding:12px 14px;border-radius:10px;margin:10px 0}.good{background:#10291a;border:1px solid #285e38}.bad{background:#351718;border:1px solid #7d3034}.warn{background:#332814;border:1px solid #725b28}
      .mode{font-size:22px;font-weight:800}.testing{color:#ffd36a}.trading{color:#74f09a}.muted{color:#9aa7b7}.mint{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;color:#a5b1c0}
      button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}input,select{padding:8px;border-radius:7px;border:1px solid #48515e;background:#10141a;color:#fff}
      table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #29303a;vertical-align:top}th{color:#a8b4c3;font-size:12px;text-transform:uppercase}
      .check{display:flex;justify-content:space-between;gap:15px;padding:7px 0;border-bottom:1px solid #29303a}.check small{text-align:right;color:#9aa7b7}
      a{color:#9dcbff}.inline{display:inline}.danger{background:#7b2226;color:#fff}.primary{background:#e8edf5;color:#101216}.safe{background:#1e6937;color:#fff}
      .walletgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;align-items:start}.walletcard{border:1px solid #303846;border-radius:11px;padding:12px;background:#12161c}.selectedwallet{border-color:#3a8f55;background:#112319}.pill{font-size:11px;background:#276a3d;padding:3px 7px;border-radius:999px;margin-left:6px}
      details.panel{background:#171b22;border:1px solid #2a313c;border-radius:14px;margin:12px 0;overflow:hidden}
      details.panel>summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:16px;user-select:none}
      details.panel>summary::-webkit-details-marker{display:none}
      details.panel>summary:after{content:'＋';font-size:18px;color:#8fa1b5;font-weight:500}
      details.panel[open]>summary:after{content:'−'}
      details.panel[open]>summary{border-bottom:1px solid #29303a}
      .panelbody{padding:16px 18px}.summarymeta{font-size:12px;font-weight:500;color:#94a3b5;margin-left:auto;text-align:right}
      .statusrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;padding:5px 8px;border-radius:999px;background:#222934;border:1px solid #333d4b;color:#c6d0db}.chip.ok{background:#10291a;border-color:#285e38}.chip.warnchip{background:#332814;border-color:#725b28}
      .hero{padding:16px 18px}.hero h2{margin:0 0 8px}.compactline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.sectiontitle{margin:22px 2px 8px;color:#9aa7b7;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
      .empty{padding:20px;text-align:center;color:#91a0b2}
      @media(max-width:700px){table{display:block;overflow-x:auto}.check{display:block}.check small{display:block;text-align:left;margin-left:25px}.summarymeta{display:none}}
      </style></head><body><div class="wrap">
      <div class="top"><div><h1>🤖 Jupiter Auto Trader <span class="version">v$${APP_VERSION}</span></h1><div class="muted">Jupiter USDC Price Alerts → ntfy → n8n → Hummingbot Gateway</div></div>
      <div><span class="muted">Workflow engine: internal</span> &nbsp; <a href="/machine.json" target="_blank">Diagnostics ↗</a></div></div>
      $${notice ? `<div class="banner good">$${html(notice)}</div>` : ''}$${warning}$${lock}

      <div class="grid">
      <div class="card hero">
        <div class="compactline">
          <div>
            <h2>Auto Trader</h2>
            <div class="mode $${modeTrading ? 'trading' : 'testing'}">$${modeTrading ? '🟢 TRADING' : '🧪 TESTING'}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:12px;color:#9aa7b7;margin-bottom:6px">MASTER</div>
            <div style="font-weight:800;margin-bottom:8px">$${state.master ? '🟢 ON' : '⚪ OFF'}</div>
            <form method="post" action="/admin/master">$${csrf}
              <input type="hidden" name="value" value="$${state.master ? 'off' : 'on'}">
              <button class="$${state.master ? 'danger' : 'safe'}">$${state.master ? 'Turn MASTER OFF' : 'Turn MASTER ON'}</button>
            </form>
          </div>
        </div>
        <div class="statusrow">
          <span class="chip $${last?.coreOk?'ok':'warnchip'}">Testing $${last?.coreOk?'ready':'not verified'}</span>
          <span class="chip $${last?.tradingOk?'ok':'warnchip'}">Trading $${last?.tradingOk?'ready':'not ready'}</span>
          <span class="chip $${streamConnected?'ok':'warnchip'}">ntfy $${streamConnected?'connected':'offline'}</span>
          <span class="chip">Impact ≤ $${html(state.maxPriceImpactPct)}%</span>
          <span class="chip">Trade ≤ $${html(state.maxTradeUSDC)} USDC</span>
        </div>
      </div>

      <div class="card hero">
        <div class="compactline">
          <div>
            <h2>Mode</h2>
            <div class="muted">$${modeTrading ? 'Real transactions are permitted when MASTER and coin controls allow them.' : 'Validation only — transaction execution is blocked.'}</div>
          </div>
          <form method="post" action="/admin/mode">$${csrf}
          $${modeTrading
            ? '<input type="hidden" name="mode" value="testing"><button class="primary">Switch to TESTING</button>'
            : '<input type="hidden" name="mode" value="trading"><input name="confirm" placeholder="type ENABLE TRADING"><button class="danger">Enable TRADING</button>'}
          </form>
        </div>
        <p class="muted" style="margin-bottom:0">Every controller restart returns to TESTING with MASTER OFF.</p>
      </div>
      </div>

      <details class="panel">
        <summary>
          <span>🔎 Quick Test & readiness</span>
          <span class="summarymeta">Testing $${last?.coreOk?'✅':'⚠️'} · Trading $${last?.tradingOk?'✅':'⚠️'}</span>
        </summary>
        <div class="panelbody">
          <form method="post" action="/admin/readiness">$${csrf}<button class="primary">Run Quick Test Everything</button></form>
          <div style="margin-top:12px">$${readinessHtml}</div>
        </div>
      </details>

      <div class="sectiontitle">Trading</div>
      <div class="card">
      <h2>Coins / Automation</h2>
      $${appError ? `<div class="banner bad">App API: $${html(appError)}</div>` : ''}
      <form method="post" action="/admin/controls">$${csrf}
      <table><thead><tr><th>Coin</th><th>Source</th><th>Scenario</th><th>Configured targets</th><th>ntfy</th><th>Trading wallet</th><th>Automation</th></tr></thead><tbody>$${rows}</tbody></table>
      <p class="muted"><b>Configured targets are reference/validation data, not an armed-state indicator.</b> A trade starts only from a fresh normal BUY/SELL ntfy alert. After Jupiter Alerts fires a target it may show that source alert as inactive until reset/cooldown; that is normal and does not need to be mirrored here. Trading Wallet is attached to the exact mint. Saving controls/assignments returns to TESTING with MASTER OFF.</p>
      <div style="margin-top:14px"><button class="primary">Save coin controls</button></div></form>
      </div>

      <div class="card">
        <div class="compactline"><h2 style="margin:0">Recent Trades</h2><span class="muted">Latest activity</span></div>
        <div style="margin-top:10px">
          <table><thead><tr><th>Time</th><th>Token</th><th>Side</th><th>Status</th><th>Impact</th><th>Signature</th></tr></thead><tbody>$${tradesHtml}</tbody></table>
        </div>
      </div>

      <div class="sectiontitle">Setup & advanced</div>

      <details class="panel" id="wallets">
      <summary>
        <span>👛 Wallets</span>
        <span class="summarymeta">$${addresses.length} wallet(s) · $${tokens.filter(t=>state.tokens[t.mint]?.wallet).length} coin assignment(s)</span>
      </summary>
      <div class="panelbody">
      $${gatewayError ? `<div class="banner bad">$${html(gatewayError)}</div>` : ''}
      <p><b>Wallet currently viewed / Gateway default:</b> $${state.selectedWallet ? `<b>$${html(walletLabel(state.selectedWallet))}</b><br><span class="mint">$${html(state.selectedWallet)}</span>` : 'No wallet selected'}</p>
      <p><b>Automatic trades do not rely on this default.</b> Each coin uses its explicitly assigned Trading Wallet. Switching the viewed/default wallet still forces <b>TESTING MODE + MASTER OFF</b> as a safe configuration change.</p>

      <form method="post" action="/admin/wallet/create">$${csrf}
        <input name="nickname" maxlength="40" placeholder="Optional nickname, e.g. Small Test Wallet">
        <button class="safe" $${state.mode==='testing' && !state.master && !activeTradeLock ? '' : 'disabled'}>➕ Create new dedicated bot wallet</button>
      </form>
      <p class="muted">The nickname is stored only by this controller. Gateway/Solana identify wallets by address. Creation requires TESTING mode, MASTER OFF, and no trade in progress.</p>

      <div class="walletgrid">$${walletCards}</div>
      $${state.selectedWallet && !state.walletBackups[state.selectedWallet] ? `<div class="banner warn"><b>Selected wallet backup is not confirmed.</b>
      <form method="post" action="/admin/wallet/mark-backed-up">$${csrf}<input name="confirm" placeholder="type I HAVE THE KEY"><button>Mark selected wallet backed up</button></form></div>` : ''}
      <p class="muted">There is intentionally no one-click Delete Wallet button. Removing an encrypted signer is an advanced recovery-sensitive action.</p>
      </div>
      </details>

      <details class="panel">
      <summary>
        <span>💰 Wallet balances</span>
        <span class="summarymeta">$${state.selectedWallet ? html(walletLabel(state.selectedWallet)) : 'No wallet selected'}</span>
      </summary>
      <div class="panelbody">
      <h3 style="margin-top:0">Viewed wallet balances</h3>
      $${state.selectedWallet ? `<table><thead><tr><th>Asset</th><th>Balance</th></tr></thead><tbody>$${balanceRows}</tbody></table>` : '<p>No wallet selected.</p>'}
      <p class="muted">Balances are read live through Gateway. Auto BUY checks USDC; Auto SELL checks the exact token mint; every real trade also checks the SOL reserve immediately before execution. Wrapped SOL uses the native SOL balance, and a SOL SELL preserves the configured reserve in addition to its sale amount.</p>
      </div>
      </details>

      <details class="panel">
      <summary><span>🛡 Trigger & replay protection</span><span class="summarymeta">$${state.requirePrivateTradingTopic?(tradingTopicReady?'Private topic ✅':'Private topic ⚠️'):'Shared topics ✅'} · $${activeGuards.length} guard(s)</span></summary>
      <div class="panelbody">
      <h3 style="margin-top:0">ntfy Topic Policy</h3>
      <form method="post" action="/admin/ntfy/policy">$${csrf}
        <label>
          <input type="checkbox" name="requirePrivateTradingTopic" $${state.requirePrivateTradingTopic?'checked':''}>
          Require private Trading Topic for real trading
        </label>
        <button style="margin-left:8px">Save policy</button>
      </form>
      <p class="muted"><b>Default: OFF.</b> Shared topics are supported. JIM and SRE may use the same topic because every normal alert contains the full mint, and the controller validates that mint against the current app configuration and effective topic before Gateway is called.</p>

      <div class="banner $${state.requirePrivateTradingTopic?(tradingTopicReady?'good':'warn'):'good'}">
        $${state.requirePrivateTradingTopic
          ? (tradingTopicReady?'Private-topic enforcement is satisfied ✅':'Private-topic enforcement is ON but not all auto-enabled coins use the generated topic ⚠️')
          : 'Shared/custom topics allowed ✅'}
      </div>

      <details>
        <summary style="cursor:pointer">Optional generated private topic</summary>
        <div style="margin-top:10px">
          <div class="mint" style="font-size:13px;background:#0b0e12;padding:12px;border-radius:8px;user-select:all">$${html(state.tradingNtfyTopic)}</div>
          <p class="muted">Use this generated value if you want the stricter private-topic mode. It is optional.</p>
          $${state.requirePrivateTradingTopic?tradingTopicRows:''}
          <form method="post" action="/admin/ntfy/rotate">$${csrf}
            <input name="confirm" placeholder="type ROTATE TRADING TOPIC">
            <button class="danger">Rotate generated topic</button>
          </form>
        </div>
      </details>
      <hr style="border-color:#29303a">
      <h3>Price-threshold replay guards</h3>
      $${triggerGuardHtml}
      <p class="muted">Default real-money behaviour mirrors the alert idea: a price threshold cannot be traded repeatedly just because duplicate/forged ntfy events arrive.</p>
      $${activeGuards.length ? `<form method="post" action="/admin/guards/reset">$${csrf}<input name="confirm" placeholder="type RESET TRIGGER GUARDS"> <button class="danger">Reset all trigger guards</button></form>
      <p class="muted">Only use this after intentionally resetting/re-arming price alerts in Jupiter USDC Price Alerts. This action also forces TESTING + MASTER OFF.</p>` : ''}
      </div>
      </details>

      <details class="panel">
      <summary><span>🌐 Solana RPC</span><span class="summarymeta">$${html(activeRpcLabel)} $${activeRpcTradingReady?'✅':'⚠️ Testing only'}</span></summary>
      <div class="panelbody">
      <h3 style="margin-top:0">One RPC for Testing + Trading</h3>
      <p>Once configured, the same RPC is used in both modes. That means the blockchain connection you dry-run is the same one that later submits real transactions.</p>
      <div class="banner $${activeRpcTradingReady?'good':'warn'}">
        <b>Current:</b> $${html(activeRpcLabel)}<br>
        <span class="mint">$${html(activeRpcDisplay||'—')}</span><br>
        $${activeRpcKind==='public'
          ? '<small>Public Solana RPC is allowed for Testing but intentionally does not satisfy Trading Ready.</small>'
          : '<small>This RPC satisfies the Trading RPC requirement when the live health check passes.</small>'}
      </div>
      $${rpcError?`<div class="banner bad">RPC manager: $${html(rpcError)}</div>`:''}

      <form method="post" action="/admin/rpc/apply">$${csrf}
      <label>Provider<br>
      <select name="rpcProvider">
        <option value="public" $${activeRpcKind==='public'?'selected':''}>Solana Public — Testing only</option>
        <option value="helius" $${activeRpcKind==='helius'?'selected':''}>Helius — recommended, free tier available</option>
        <option value="custom" $${activeRpcKind==='custom'?'selected':''}>Custom RPC — advanced</option>
      </select></label><br><br>

      <label>Helius API key<br>
      <input type="password" name="heliusApiKey" autocomplete="new-password" placeholder="$${rpcManagerInfo?.heliusKeyConfigured?'Already configured — leave blank to keep it':'Paste Helius API key'}" style="min-width:min(520px,90%)"></label>
      <p class="muted">Only needed when selecting Helius. The key is written directly to Gateway's config and is never sent to n8n or stored in controller state. <a href="https://www.helius.dev/" target="_blank" rel="noreferrer">Get a Helius key ↗</a></p>

      <label>Custom Solana RPC URL<br>
      <input type="password" name="customRpcUrl" autocomplete="off" placeholder="https://your-rpc.example/..." style="min-width:min(520px,90%)"></label>
      <p class="muted">Only needed for Custom RPC. URLs may contain provider API keys, so they are never shown back unredacted.</p>

      <button class="primary">Test & Apply RPC</button>
      </form>
      <p class="muted"><b>Safety:</b> changing RPC is only allowed in TESTING with MASTER OFF. The RPC is tested first; then Gateway is restarted internally and the dashboard verifies the requested provider actually became active.</p>
      </div>
      </details>

      <details class="panel">
      <summary><span>⚙️ Safety settings</span><span class="summarymeta">Impact ≤$${html(state.maxPriceImpactPct)}% · Trade ≤$${html(state.maxTradeUSDC)} USDC · SOL $${html(state.minSolReserve)}</span></summary>
      <div class="panelbody">
      <form method="post" action="/admin/safety">$${csrf}
      <label>Minimum SOL reserve<br><input type="number" name="minSolReserve" step="0.001" min="0.001" value="$${html(state.minSolReserve)}"></label><br><br>
      <label>Gateway slippage %<br><input type="number" name="slippagePct" step="0.1" min="0" max="10" value="$${html(state.slippagePct)}"></label><br>
      <span class="muted">Tolerance for price movement after a quote. This is different from price impact.</span><br><br>
      <label>Maximum price impact %<br><input type="number" name="maxPriceImpactPct" step="0.1" min="0.1" max="25" value="$${html(state.maxPriceImpactPct)}"></label><br>
      <span class="muted">Hard block on every Gateway quote. Jupiter reports impact as a decimal; the controller converts it to % before comparing.</span><br><br>
      <label>Maximum trade scenario (USDC)<br><input type="number" name="maxTradeUSDC" step="1" min="1" max="1000000" value="$${html(state.maxTradeUSDC)}"></label><br>
      <span class="muted">Independent cap protecting against an accidental oversized usd_amount in Jupiter Alerts.</span><br><br>
      <label>Multiple thresholds<br><select name="burstPolicy">
      <option value="collapse" $${state.burstPolicy==='collapse'?'selected':''}>Safest: one real trade per coin/direction burst</option>
      <option value="every-alert" $${state.burstPolicy==='every-alert'?'selected':''}>Advanced: trade every fired alert</option></select></label><br><br>
      <label>Burst window seconds<br><input type="number" name="burstWindowSec" min="5" max="300" value="$${html(state.burstWindowSec)}"></label><br><br>
      <button>Save safety settings</button>
      </form>
      </div>
      </details>

      <details class="panel">
      <summary><span>🔌 Gateway & listener</span><span class="summarymeta">$${gatewayError?'Gateway issue':'Gateway ✅'} · ntfy $${streamConnected?'✅':'⚠️'}</span></summary>
      <div class="panelbody">
      <p>Gateway: <b>$${gatewayError ? '❌' : '✅ reachable'}</b></p>
      <p>ntfy stream: <b>$${streamConnected ? '✅ connected' : '❌ disconnected'}</b></p>
      <p>Topics: <span class="mint">$${html(activeTopics.join(', ') || '—')}</span></p>
      <p>Last ntfy: $${html(lastForwardedAt || '—')}</p>
      <p>Last decision: <b>$${html(lastDecision || '—')}</b></p>
      <p><a href="/gateway" target="_blank">Open Gateway Diagnostics ↗</a><br><a href="/machine.json" target="_blank">View full machine state ↗</a></p>
      </div>
      </details>

      $${state.safetyLock ? `<div class="card"><h2>Resolve safety lock</h2><p>Only clear this after checking the wallet/transaction state. No automatic retry is performed.</p>
      <form method="post" action="/admin/clear-lock">$${csrf}<input name="confirm" placeholder="type CLEAR SAFETY LOCK"> <button class="danger">Clear lock</button></form></div>` : ''}


      $${auth.mustChange ? `<div class="card"><h2>Change first-run password</h2><form method="post" action="/admin/change-password">$${csrf}
      <input type="password" name="password" minlength="12" maxlength="256" placeholder="new password (12+ chars)"> <input type="password" name="confirm" minlength="12" maxlength="256" placeholder="repeat">
      <button>Change password</button></form></div>` : ''}

      <div class="card"><form method="post" action="/logout">$${csrf}<button>Log out</button></form>
      $${DASHBOARD_COOKIE_SECURE
        ? '<p class="muted">Secure-cookie mode is enabled. Keep direct HTTP access blocked and use only your HTTPS reverse-proxy URL.</p>'
        : '<p class="muted">This console uses HTTP on your LAN because that is your current setup. Do not expose port 5680 to the internet. Use HTTPS/Tailscale/reverse-proxy protection for untrusted networks.</p>'}</div>
      </div></body></html>`;
      }

      function loginPage(error = '') {
        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Login</title>
      <style>body{font-family:system-ui;background:#101216;color:#eef2f7}.box{max-width:420px;margin:12vh auto;background:#171b22;padding:24px;border-radius:14px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px}.bad{color:#ff9299}</style></head>
      <body><div class="box"><h1>🤖 Jupiter Auto Trader</h1>$${error ? `<p class="bad">$${html(error)}</p>` : ''}
      <p>Enter the admin password.</p>$${auth.mustChange ? '<p>The first-run password is printed once in the <b>trading-controller</b> container logs.</p>' : ''}
      <form method="post" action="/login"><input type="password" name="password" autofocus><button>Log in</button></form></div></body></html>`;
      }

      async function recoveryPage(session, address, secret) {
        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save Wallet Recovery</title>
      <style>body{font-family:system-ui;background:#101216;color:#eef2f7}.box{max-width:850px;margin:40px auto;background:#171b22;padding:24px;border-radius:14px}.secret{font-family:monospace;word-break:break-all;background:#0b0d10;padding:14px;border-radius:8px}.warn{background:#3b2510;padding:14px;border-radius:8px}button{padding:12px;border:0;border-radius:8px;font-weight:bold}</style></head>
      <body><div class="box"><h1>🔐 Save this recovery key now</h1>
      <div class="warn"><b>This is shown once.</b> Store it in your password manager/offline backup. Never post it in n8n, Discord, GitHub or chat.<br><br><b>Security:</b> your current console uses HTTP on a trusted LAN. Do not create/view recovery keys over an untrusted network; use HTTPS/Tailscale before sharing this deployment remotely.</div>
      <p><b>Wallet address</b></p><div class="secret">$${html(address)}</div>
      <p><b>Solana private/recovery key (Base58)</b></p><div class="secret">$${html(secret)}</div>
      <p>Gateway has already imported the wallet and encrypted its stored copy. Trading Mode stays blocked until you confirm the backup.</p>
      <form method="post" action="/admin/wallet/backup-confirm">$${formHidden(session)}
      <input type="hidden" name="address" value="$${html(address)}"><input name="confirm" placeholder="type I SAVED IT">
      <button>I saved the recovery key</button></form>
      <p><a href="/">Back without confirming</a></p></div></body></html>`;
      }


      async function gatewayDiagnosticsPage(session) {
        const csrf=formHidden(session);
        const checks=[];
        async function run(label,fn) {
          try { const value=await fn(); checks.push({label,ok:true,value}); }
          catch(e){ checks.push({label,ok:false,value:{error:e.message||String(e)}}); }
        }
        await run('Gateway health',()=>gateway('/'));
        await run('Solana status',async()=>{
          const s=await gateway(`/chains/solana/status?network=$${encodeURIComponent(NETWORK)}`);
          return {...s,rpcUrl:redactRpcUrl(s?.rpcUrl||'')};
        });
        await run('Wallets',()=>getWallets());
        await run('OpenAPI compatibility',async()=>{
          const docs=await gateway('/docs/json');
          const c=requiredApiPathsPresent(docs);
          return {version:docs?.info?.version||null,compatible:c.ok,missing:c.missing};
        });
        await run('Sample Jupiter quote',()=>gateway(`/connectors/jupiter/router/quote-swap?network=$${encodeURIComponent(NETWORK)}&baseToken=SOL&quoteToken=USDC&amount=0.001&side=SELL&slippagePct=$${encodeURIComponent(state.slippagePct)}`));
        const blocks=checks.map(c=>`<div class="diag $${c.ok?'ok':'fail'}"><h3>$${c.ok?'✅':'❌'} $${html(c.label)}</h3><pre>$${html(JSON.stringify(c.value,null,2))}</pre></div>`).join('');
        return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateway Diagnostics</title>
      <style>body{font-family:system-ui;background:#0f1217;color:#edf2f7}.wrap{max-width:1050px;margin:30px auto;padding:0 16px}.diag{padding:14px;margin:12px 0;border-radius:12px;background:#171b22;border:1px solid #303846}.ok{border-color:#285e38}.fail{border-color:#7d3034}pre{white-space:pre-wrap;word-break:break-word;background:#0b0e12;padding:12px;border-radius:8px}a{color:#9dcbff}</style></head>
      <body><div class="wrap"><h1>🛠 Gateway Diagnostics</h1><p><a href="/">← Dashboard</a> &nbsp; <a href="/machine.json">Machine JSON</a></p>
      <p>This page runs only safe read-only health/status/list/quote checks. There is deliberately no arbitrary Gateway command console.</p>$${blocks}
      <form method="post" action="/admin/readiness">$${csrf}<button>Run full Quick Test Everything</button></form></div></body></html>`;
      }

      const admin = http.createServer(async (req, res) => {
        try {
          const u = new URL(req.url, 'http://admin');
          if (u.pathname === '/healthz') return send(res, 200, JSON.stringify({ok:true}), 'application/json');
          if (u.pathname === '/login' && req.method === 'GET') return send(res, 200, loginPage());
          if (u.pathname === '/login' && req.method === 'POST') {
            const ls=loginStatus(req);
            if (ls.blocked) return send(res,429,loginPage(`Too many failed attempts. Try again in $${ls.retryAfter}s.`));
            const f = parseForm(await readBody(req));
            if (!verifyPassword(String(f.password || ''))) {
              recordLoginFailure(req);
              return send(res, 401, loginPage('Incorrect password'));
            }
            recordLoginSuccess(req);
            const token = createSession();
            return send(res, 303, '', 'text/plain', {
              location: '/',
              'set-cookie': sessionCookie(token,43200)
            });
          }

          const session = requireAdmin(req, res);
          if (!session) return;

          if (u.pathname === '/machine.json' && req.method === 'GET') {
            let app = null, wallets = null;
            try { app = await getApp(); syncTokenControls(app); } catch {}
            try { wallets = await getWallets(); } catch {}
            return send(res, 200, JSON.stringify({
              version:APP_VERSION, state:safePublicState(), auth:{mustChange:auth.mustChange},
              ntfy:{streamConnected,activeTopics,desiredTopics,lastTopicRefreshAt,lastForwardedAt,lastForwardedId,lastDecision,lastError},
              app:{tokenCount:app?.tokens?.length || 0},
              gateway:{wallets},
              activeTradeLock,
              triggerGuards,
              recentTrades:trades.slice(-20),
              recentAudit:audit.slice(-30),
            }, null, 2), 'application/json');
          }
          if (u.pathname === '/' && req.method === 'GET') return send(res, 200, await dashboard(req, session));
          if (u.pathname === '/gateway' && req.method === 'GET') return send(res, 200, await gatewayDiagnosticsPage(session));

          if (req.method !== 'POST') return send(res, 404, 'Not found', 'text/plain');
          const f = parseForm(await readBody(req));
          if (!checkCsrf(f, session)) return send(res, 403, 'Invalid CSRF token', 'text/plain');

          if (u.pathname === '/logout') {
            return send(res, 303, '', 'text/plain', { location:'/login', 'set-cookie':sessionCookie('',0) });
          }
          if (u.pathname === '/admin/change-password') {
            const p = String(f.password || '');
            if (p.length < 12 || p.length > 256 || p !== String(f.confirm || '')) return send(res, 400, 'Password must be 12–256 characters and match.', 'text/plain');
            setPassword(p, false);
            state.mode = 'testing'; state.master = false; saveState();
            return send(res, 303, '', 'text/plain', { location:'/login', 'set-cookie':sessionCookie('',0) });
          }
          if (u.pathname === '/admin/controls') {
            if(activeTradeLock) return send(res,409,'Cannot change coin controls/wallet assignments while a trade is in progress.','text/plain');
            let app=await getApp();syncTokenControls(app);
            const gatewayWallets=solanaWalletAddresses(await getWallets());
            let changed=false;
            for(const t of app.tokens||[]){
              const prior=state.tokens[t.mint]||{autoBuy:false,autoSell:false,wallet:null};
              const requestedWallet=String(f[`wallet_$${t.mint}`]||'').trim()||null;
              if(requestedWallet && !gatewayWallets.includes(requestedWallet)) return send(res,400,`Assigned wallet for $${html(t.name)} is not present in Gateway.`,'text/plain');
              const next={
                autoBuy:Object.prototype.hasOwnProperty.call(f,`autoBuy_$${t.mint}`),
                autoSell:Object.prototype.hasOwnProperty.call(f,`autoSell_$${t.mint}`),
                wallet:requestedWallet
              };
              if(prior.autoBuy!==next.autoBuy||prior.autoSell!==next.autoSell||prior.wallet!==next.wallet)changed=true;
              state.tokens[t.mint]=next;
            }
            if(changed){state.mode='testing';state.master=false;}
            saveState();addAudit('CONTROLS_UPDATED',{forcedSafe:changed});
            return redirect(res,'/');
          }
          if (u.pathname === '/admin/rpc/apply') {
            if(rpcChangeLock)
              return send(res,409,'An RPC provider change is already in progress.','text/plain');
            if(state.mode!=='testing'||state.master||activeTradeLock)
              return send(res,409,'RPC changes require TESTING mode, MASTER OFF, and no trade in progress.','text/plain');
            const provider=String(f.rpcProvider||'').trim().toLowerCase();
            if(!['public','helius','custom'].includes(provider))
              return send(res,400,'Invalid RPC provider','text/plain');
            const heliusApiKey=String(f.heliusApiKey||'').trim();
            const customRpcUrl=String(f.customRpcUrl||'').trim();

            rpcChangeLock=true;
            state.lastReadiness=null;saveState();
            try{
              const applied=await applyRpcProvider(provider,heliusApiKey,customRpcUrl);
              state.mode='testing';state.master=false;saveState();
              addAudit('RPC_PROVIDER_APPLIED',{provider,endpoint:applied?.endpoint||null});

              // The configurator requests a fresh Gateway process only after direct RPC preflight.
              // Require both that request's acknowledgement and the exact endpoint fingerprint.
              const live=await waitForGatewayRpc(provider,applied?.requestId,applied?.rpcUrlHash,120000);
              addAudit('RPC_PROVIDER_ACTIVE',{provider,rpcUrl:redactRpcUrl(live?.rpcUrl||'')});
              state.lastReadiness=null;saveState();
              return redirect(res,'/');
            }finally{
              rpcChangeLock=false;
            }
          }
          if (u.pathname === '/admin/safety') {
            if(activeTradeLock) return send(res,409,'Cannot change safety settings while a trade is in progress.','text/plain');
            const reserve=Number(f.minSolReserve),slip=Number(f.slippagePct),burst=Number(f.burstWindowSec);
            const maxImpact=Number(f.maxPriceImpactPct),maxTrade=Number(f.maxTradeUSDC);
            if(!Number.isFinite(reserve)||reserve<0.001||!Number.isFinite(slip)||slip<0||slip>10||
               !Number.isFinite(maxImpact)||maxImpact<0.1||maxImpact>25||
               !Number.isFinite(maxTrade)||maxTrade<1||maxTrade>1000000||
               !Number.isFinite(burst)||burst<5||burst>300){
              return send(res,400,'Invalid safety setting','text/plain');
            }
            const nextBurst=f.burstPolicy==='every-alert'?'every-alert':'collapse';
            const changed=state.minSolReserve!==reserve||state.slippagePct!==slip||
              state.maxPriceImpactPct!==maxImpact||state.maxTradeUSDC!==maxTrade||
              state.burstPolicy!==nextBurst||state.burstWindowSec!==Math.floor(burst);
            state.minSolReserve=reserve;state.slippagePct=slip;state.maxPriceImpactPct=maxImpact;state.maxTradeUSDC=maxTrade;
            state.burstPolicy=nextBurst;state.burstWindowSec=Math.floor(burst);
            if(changed){state.mode='testing';state.master=false;}
            saveState();addAudit('SAFETY_SETTINGS_UPDATED',{forcedSafe:changed,maxImpact,maxTrade});
            return redirect(res,'/');
          }
          if (u.pathname === '/admin/master') {
            const desired = f.value === 'on';
            if (desired && state.mode === 'trading') {
              const r = await readiness();
              if (!r.tradingOk) return send(res, 409, 'Trading readiness is not green. Run Quick Test Everything and fix failures first.', 'text/plain');
              if(rpcChangeLock || activeTradeLock || state.mode!=='trading')
                return send(res,409,'Trading state changed while readiness was running. Wait for the active operation, then test again.','text/plain');
            }
            state.master = desired; saveState(); addAudit('MASTER_CHANGED', {value:desired});
            return redirect(res, '/');
          }
          if (u.pathname === '/admin/mode') {
            if (f.mode === 'testing') {
              state.mode = 'testing'; state.master = false; saveState(); addAudit('MODE_CHANGED',{mode:'testing'});
              return redirect(res, '/');
            }
            if (f.mode === 'trading') {
              if (String(f.confirm || '').trim() !== 'ENABLE TRADING') return send(res, 400, 'Type ENABLE TRADING exactly.', 'text/plain');
              const r = await readiness();
              if (!r.tradingOk) return send(res, 409, 'Not ready for Trading Mode. Run Quick Test Everything and fix every red trading check.', 'text/plain');
              if(rpcChangeLock || activeTradeLock || state.mode!=='testing' || state.master)
                return send(res,409,'Configuration changed while readiness was running. Return to TESTING with MASTER OFF, then test again.','text/plain');
              state.mode = 'trading'; state.master = false; saveState(); addAudit('MODE_CHANGED',{mode:'trading'});
              return redirect(res, '/');
            }
          }
          if (u.pathname === '/admin/readiness') {
            await readiness(); return redirect(res, '/');
          }
          if (u.pathname === '/admin/wallet/create') {
            if (state.mode !== 'testing' || state.master || activeTradeLock) return send(res, 409, 'Wallet creation requires TESTING mode, MASTER OFF, and no trade in progress.', 'text/plain');
            const nickname=cleanNickname(f.nickname);
            const { publicKey, privateKey } = crypto.generateKeyPairSync('ed25519');
            const jwk = privateKey.export({ format:'jwk' });
            if (!jwk.d || !jwk.x) throw new Error('Node failed to export Ed25519 key material');
            const seed = b64urlDecode(jwk.d), pub = b64urlDecode(jwk.x);
            if (seed.length !== 32 || pub.length !== 32) throw new Error('Unexpected Ed25519 key length');
            const secret58 = base58Encode(Buffer.concat([seed, pub]));
            const expectedAddress = base58Encode(pub);
            const added = await gateway('/wallet/add', {
              method:'POST', headers:{'content-type':'application/json'},
              body:JSON.stringify({chain:'solana',privateKey:secret58,setDefault:true})
            }, 20000);
            if (!added?.address || added.address !== expectedAddress) throw new Error('Gateway wallet address did not match generated public key');
            state.selectedWallet = added.address;
            state.walletBackups[added.address] = false;
            state.walletMeta[added.address] = {nickname,createdAt:nowIso()};
            state.mode = 'testing'; state.master = false; saveState();
            pendingRecovery.set(added.address, {expires:Date.now()+15*60*1000});
            addAudit('WALLET_CREATED',{address:added.address,nickname});
            return send(res, 200, await recoveryPage(session, added.address, secret58));
          }
          if (u.pathname === '/admin/wallet/backup-confirm') {
            const address = String(f.address || '');
            const p = pendingRecovery.get(address);
            if (!p || p.expires < Date.now()) {
              if(p)pendingRecovery.delete(address);
              return send(res, 410, 'Recovery confirmation window expired. Do not enable trading until you have a valid recovery backup.', 'text/plain');
            }
            if (String(f.confirm || '').trim() !== 'I SAVED IT') return send(res, 400, 'Type I SAVED IT exactly.', 'text/plain');
            state.walletBackups[address] = true; pendingRecovery.delete(address); saveState();
            addAudit('WALLET_BACKUP_CONFIRMED',{address}); return redirect(res, '/');
          }
          if (u.pathname === '/admin/wallet/select') {
            if (activeTradeLock) return send(res,409,'Cannot switch wallets while a trade is in progress.','text/plain');
            const address = String(f.address || '');
            const wallets = solanaWalletAddresses(await getWallets());
            if (!wallets.includes(address)) return send(res, 400, 'Wallet not found in Gateway.', 'text/plain');
            await gateway('/wallet/setDefault', {
              method:'POST', headers:{'content-type':'application/json'},
              body:JSON.stringify({chain:'solana',address})
            }, 10000);
            ensureWalletMeta(address);
            state.selectedWallet = address; state.mode='testing'; state.master=false; saveState();
            addAudit('WALLET_SELECTED',{address,nickname:walletLabel(address)}); return redirect(res, '/');
          }
          if (u.pathname === '/admin/wallet/rename') {
            const address=String(f.address||'');
            const wallets=solanaWalletAddresses(await getWallets());
            if(!wallets.includes(address)) return send(res,400,'Wallet not found in Gateway.','text/plain');
            const nickname=cleanNickname(f.nickname);
            const meta=ensureWalletMeta(address);
            meta.nickname=nickname;
            if(!meta.createdAt) meta.createdAt=nowIso();
            saveState(); addAudit('WALLET_RENAMED',{address,nickname});
            return redirect(res,'/#wallets');
          }
          if (u.pathname === '/admin/wallet/mark-backed-up') {
            if (!state.selectedWallet) return send(res,400,'No wallet selected','text/plain');
            if (String(f.confirm || '').trim() !== 'I HAVE THE KEY') return send(res,400,'Type I HAVE THE KEY exactly.','text/plain');
            state.walletBackups[state.selectedWallet] = true; saveState();
            addAudit('WALLET_BACKUP_MARKED',{address:state.selectedWallet}); return redirect(res,'/');
          }
          if (u.pathname === '/admin/guards/reset') {
            if (state.mode !== 'testing' || state.master || activeTradeLock) return send(res,409,'Resetting trigger guards requires TESTING mode, MASTER OFF, and no active trade.','text/plain');
            if (String(f.confirm || '').trim() !== 'RESET TRIGGER GUARDS') return send(res,400,'Type RESET TRIGGER GUARDS exactly.','text/plain');
            const count=Object.keys(triggerGuards).length;
            triggerGuards={}; saveTriggerGuards();
            addAudit('TRIGGER_GUARDS_RESET',{count});
            return redirect(res,'/');
          }
          if (u.pathname === '/admin/ntfy/policy') {
            if(activeTradeLock) return send(res,409,'Cannot change ntfy topic policy while a trade is in progress.','text/plain');
            const next=Object.prototype.hasOwnProperty.call(f,'requirePrivateTradingTopic');
            const changed=state.requirePrivateTradingTopic!==next;
            state.requirePrivateTradingTopic=next;
            if(changed){state.mode='testing';state.master=false;}
            saveState();addAudit('TRADING_NTFY_POLICY_CHANGED',{requirePrivateTradingTopic:next,forcedSafe:changed});
            return redirect(res,'/');
          }
          if (u.pathname === '/admin/ntfy/rotate') {
            if(state.mode!=='testing'||state.master||activeTradeLock)
              return send(res,409,'Topic rotation requires TESTING mode, MASTER OFF, and no trade in progress.','text/plain');
            if(String(f.confirm||'').trim()!=='ROTATE TRADING TOPIC')
              return send(res,400,'Type ROTATE TRADING TOPIC exactly.','text/plain');
            state.tradingNtfyTopic=`trade-$${crypto.randomBytes(24).toString('base64url')}`;
            saveState();addAudit('TRADING_NTFY_TOPIC_ROTATED');
            return redirect(res,'/');
          }
          if (u.pathname === '/admin/clear-lock') {
            if(!state.safetyLock) return send(res,409,'No safety lock is active. An in-flight trade lock cannot be cleared manually.','text/plain');
            if (String(f.confirm || '').trim() !== 'CLEAR SAFETY LOCK') return send(res,400,'Type CLEAR SAFETY LOCK exactly.','text/plain');
            const reviewedAt=nowIso();let reviewedTrades=0;
            for(const trade of trades){
              if(trade.status==='UNCERTAIN'){
                trade.status='REVIEWED';trade.reviewedAt=reviewedAt;trade.updatedAt=reviewedAt;reviewedTrades+=1;
              }
            }
            if(reviewedTrades)saveTrades();
            state.safetyLock=false; state.safetyReason=null; state.mode='testing'; state.master=false; activeTradeLock=null; saveState();
            addAudit('SAFETY_LOCK_CLEARED',{reviewedTrades}); return redirect(res,'/');
          }
          return send(res, 404, 'Not found', 'text/plain');
        } catch (e) {
          console.error('[admin]', e);
          send(res, 500, `<h1>Error</h1><pre>$${html(e.message || e)}</pre>`);
        }
      });

      function safePublicState() {
        return {
          version:`$${APP_VERSION}-portable-storage`, mode:state.mode, master:state.master,
          tokens:state.tokens, selectedWallet:state.selectedWallet,
          selectedWalletNickname:state.selectedWallet ? walletLabel(state.selectedWallet) : null,
          walletBackupConfirmed:!!state.selectedWallet && state.walletBackups[state.selectedWallet]===true,
          minSolReserve:state.minSolReserve, slippagePct:state.slippagePct,
          maxPriceImpactPct:state.maxPriceImpactPct,maxTradeUSDC:state.maxTradeUSDC,
          requirePrivateTradingTopic:state.requirePrivateTradingTopic,
          burstPolicy:state.burstPolicy, burstWindowSec:state.burstWindowSec,
          safetyLock:state.safetyLock, safetyReason:state.safetyReason,
          updatedAt:state.updatedAt,
        };
      }
      async function internalJson(req, res, fn) {
        try { return await fn(); } catch (e) {
          console.error('[internal]', e);
          return send(res, 500, JSON.stringify({ok:false,error:e.message || String(e)}), 'application/json');
        }
      }
      function cleanOldHandoffs() {
        const now = Date.now();
        for (const [k,v] of pendingRecovery) if (v.expires < now) pendingRecovery.delete(k);
        for (const [k,v] of pendingHandoffs) if (v.expires < now) pendingHandoffs.delete(k);
        for (const [k,v] of claimedHandoffs) if (v.expires < now) claimedHandoffs.delete(k);
      }
      async function executeTrade(body) {
        const alertId = String(body.alertId || '');
        const claimed = claimedHandoffs.get(alertId);
        if (!claimed || claimed.expires < Date.now()) throw new Error('Alert handoff is not active/claimed');
        if (trades.some(t => t.alertId === alertId)) return trades.find(t => t.alertId === alertId);

        if (state.mode !== 'trading') throw new Error('System is not in TRADING mode');
        if (!state.master) throw new Error('MASTER AUTO TRADING is OFF');
        if (state.safetyLock) throw new Error(`Safety lock active: $${state.safetyReason || 'locked'}`);
        if (rpcChangeLock) throw new Error('RPC configuration change is in progress');

        const direction = body.direction === 'BUY' ? 'BUY' : body.direction === 'SELL' ? 'SELL' : null;
        const mint = String(body.mint || '');
        const target = body.target;
        const usdAmount = body.usdAmount;
        const tokenAmount = body.tokenAmount == null ? 0 : body.tokenAmount;
        const alertTopic=String(body.topic||'');
        const q = body.quote || {};
        const quoteId=typeof q.quoteId==='string'?q.quoteId.trim():'';
        if (!direction || !isMint(mint) || typeof target!=='number' || !Number.isFinite(target) || target<=0 ||
            typeof usdAmount!=='number' || !Number.isFinite(usdAmount) || usdAmount<=0 || !quoteId)
          throw new Error('Invalid trade request');

        const app = await getApp(); syncTokenControls(app);
        const tokenMatches=(Array.isArray(app?.tokens)?app.tokens:[]).filter(t=>t?.mint===mint);
        if(tokenMatches.length!==1)throw new Error('Token mint no longer has exactly one source configuration');
        const token=tokenMatches[0];
        if (token.enabled !== true) throw new Error('Token is no longer enabled in app');
        const liveTopic=currentEffectiveTopic(app,mint);
        if(!liveTopic || alertTopic!==liveTopic)
          throw new Error('Alert ntfy topic no longer matches this token\'s current effective topic');
        if(state.requirePrivateTradingTopic && liveTopic!==state.tradingNtfyTopic)
          throw new Error('Private Trading Topic is required but this token is not using the controller-generated topic');
        const c=state.tokens[mint]||{autoBuy:false,autoSell:false,wallet:null};
        const tradeWallet=c.wallet||null;
        const requestedWallet=String(body.assignedWallet||'')||null;
        if(!tradeWallet)throw new Error(`$${token.name} has no trading wallet assigned`);
        if(requestedWallet!==tradeWallet)throw new Error(`$${token.name} trading wallet assignment changed during validation`);
        if (direction === 'BUY' && !c.autoBuy) throw new Error(`$${token.name} AUTO BUY is OFF`);
        if (direction === 'SELL' && !c.autoSell) throw new Error(`$${token.name} AUTO SELL is OFF`);
        const list = direction === 'BUY' ? token.buy_alerts || [] : token.sell_alerts || [];
        if (!list.some(v => approx(v, target))) throw new Error('Fired target is no longer configured');
        if (!approx(token.usd_amount, usdAmount)) throw new Error('USDC scenario changed');
        if (!(usdAmount > 0) || usdAmount > Number(state.maxTradeUSDC))
          throw new Error(`Trade scenario $${usdAmount} USDC exceeds safety cap $${state.maxTradeUSDC} USDC`);

        const guard=guardStatus(token,direction,target);
        if (guard.blocked) {
          return {
            at:nowIso(),alertId,name:token.name,mint,direction,status:'TRIGGER_GUARD_SUPPRESSED',
            reason:`This exact $${direction} threshold was already used for a real trade and is still guarded`,
            guardedAt:guard.row?.at||null,signature:null
          };
        }

        const wallets=solanaWalletAddresses(await getWallets());
        if(!wallets.includes(tradeWallet))throw new Error(`$${token.name} assigned trading wallet is no longer present in Gateway`);
        if(state.walletBackups[tradeWallet]!==true)throw new Error(`$${token.name} assigned wallet recovery is not confirmed`);

        const expectedIn = direction === 'BUY' ? USDC_MINT : mint;
        const expectedOut = direction === 'BUY' ? mint : USDC_MINT;
        if (String(q.tokenIn) !== expectedIn || String(q.tokenOut) !== expectedOut) throw new Error('Final quote token direction mismatch');
        const amountIn = q.amountIn, amountOut = q.amountOut;
        if (typeof amountIn!=='number' || !Number.isFinite(amountIn) || amountIn<=0 ||
            typeof amountOut!=='number' || !Number.isFinite(amountOut) || amountOut<=0)
          throw new Error('Invalid final quote amounts');
        const finalImpactPercent=priceImpactPercent(q.priceImpactPct);
        if(finalImpactPercent===null || finalImpactPercent>Number(state.maxPriceImpactPct))
          throw new Error(`Final quote price impact $${finalImpactPercent===null?'invalid':finalImpactPercent.toFixed(2)+'%'} exceeds cap $${state.maxPriceImpactPct}%`);
        const effective = direction === 'BUY' ? amountIn / amountOut : amountOut / amountIn;
        if(!Number.isFinite(effective)||effective<=0)throw new Error('Invalid final quote effective price');
        if (direction === 'BUY' && effective > target) throw new Error('Final BUY quote no longer meets target');
        if (direction === 'SELL' && effective < target) throw new Error('Final SELL quote no longer meets target');
        if (direction === 'BUY' && !approx(amountIn, usdAmount, 1e-6, 1e-8)) throw new Error('Final BUY quote amount differs from configured USDC scenario');
        if (direction === 'SELL' && (typeof tokenAmount!=='number' || !Number.isFinite(tokenAmount) ||
            !(tokenAmount > 0) || !approx(amountIn, tokenAmount, 1e-6, 1e-8)))
          throw new Error('Final SELL quote amount differs from validated token amount');

        const bal=await getBalancesNormalized(tradeWallet,mint,token.name);
        const requiredSol=requiredSolBalance(mint,direction,amountIn,state.minSolReserve);
        if (Number(bal.sol)+1e-9 < requiredSol) throw new Error(`SOL balance/reserve too low ($${bal.sol} < $${requiredSol})`);
        if (direction === 'BUY' && Number(bal.usdc) + 1e-9 < amountIn) throw new Error(`Insufficient USDC ($${bal.usdc} < $${amountIn})`);
        if (direction === 'SELL' && Number(bal.token) + 1e-9 < amountIn) throw new Error(`Insufficient $${token.name} ($${bal.token} < $${amountIn})`);

        // Close the asynchronous validation window immediately before lock acquisition/submission.
        // This also makes a concurrent replay idempotent if its first duplicate check ran before
        // the original request persisted its trade record.
        // Read balances first, then fetch source configuration last so a remote disable/topic/target
        // change made during the balance request is still observed before the synchronous lock step.
        const finalBal=await getBalancesNormalized(tradeWallet,mint,token.name);
        let existingTrade=trades.find(t=>t.alertId===alertId);
        if(existingTrade)return existingTrade;
        const finalApp=await getApp(); syncTokenControls(finalApp);
        existingTrade=trades.find(t=>t.alertId===alertId);
        if(existingTrade)return existingTrade;
        const finalTokenMatches=(Array.isArray(finalApp?.tokens)?finalApp.tokens:[]).filter(t=>t?.mint===mint);
        if(finalTokenMatches.length!==1)throw new Error('Token mint changed or became duplicated during final controller validation');
        const finalToken=finalTokenMatches[0];
        if(finalToken.enabled!==true)throw new Error('Token changed or was disabled during final controller validation');
        const finalTopic=currentEffectiveTopic(finalApp,mint);
        if(!finalTopic||finalTopic!==alertTopic)throw new Error('Alert ntfy topic changed during final controller validation');
        if(state.mode!=='trading')throw new Error('System left TRADING mode during final controller validation');
        if(!state.master)throw new Error('MASTER was turned OFF during final controller validation');
        if(state.safetyLock)throw new Error(`Safety lock became active: $${state.safetyReason||'locked'}`);
        if(rpcChangeLock)throw new Error('RPC configuration changed during final controller validation');
        if(state.requirePrivateTradingTopic&&finalTopic!==state.tradingNtfyTopic)
          throw new Error('Private Trading Topic requirement changed during final controller validation');
        const finalControl=state.tokens[mint]||{autoBuy:false,autoSell:false,wallet:null};
        if(finalControl.wallet!==tradeWallet)throw new Error('Trading wallet assignment changed during final controller validation');
        if(direction==='BUY'&&finalControl.autoBuy!==true)throw new Error(`$${finalToken.name} AUTO BUY was turned OFF during final controller validation`);
        if(direction==='SELL'&&finalControl.autoSell!==true)throw new Error(`$${finalToken.name} AUTO SELL was turned OFF during final controller validation`);
        const finalTargets=direction==='BUY'?(finalToken.buy_alerts||[]):(finalToken.sell_alerts||[]);
        if(!finalTargets.some(v=>approx(v,target)))throw new Error('Fired target changed during final controller validation');
        if(!approx(finalToken.usd_amount,usdAmount))throw new Error('USDC scenario changed during final controller validation');
        if(usdAmount>Number(state.maxTradeUSDC))throw new Error(`Trade scenario $${usdAmount} USDC exceeds current safety cap $${state.maxTradeUSDC} USDC`);
        if(finalImpactPercent>Number(state.maxPriceImpactPct))
          throw new Error(`Final quote price impact $${finalImpactPercent.toFixed(2)}% exceeds current cap $${state.maxPriceImpactPct}%`);
        if(state.walletBackups[tradeWallet]!==true)throw new Error('Trading wallet recovery confirmation changed during final controller validation');
        const finalRequiredSol=requiredSolBalance(mint,direction,amountIn,state.minSolReserve);
        if(Number(finalBal.sol)+1e-9<finalRequiredSol)throw new Error(`SOL balance/reserve changed during final controller validation ($${finalBal.sol} < $${finalRequiredSol})`);
        if(direction==='BUY'&&Number(finalBal.usdc)+1e-9<amountIn)throw new Error(`USDC balance changed during final controller validation ($${finalBal.usdc} < $${amountIn})`);
        if(direction==='SELL'&&Number(finalBal.token)+1e-9<amountIn)throw new Error(`$${finalToken.name} balance changed during final controller validation ($${finalBal.token} < $${amountIn})`);
        const finalGuard=guardStatus(finalToken,direction,target);
        if(finalGuard.blocked){
          return {
            at:nowIso(),alertId,name:finalToken.name,mint,direction,status:'TRIGGER_GUARD_SUPPRESSED',
            reason:`This exact $${direction} threshold was already used for a real trade and is still guarded`,
            guardedAt:finalGuard.row?.at||null,signature:null
          };
        }

        if (state.burstPolicy === 'collapse') {
          const cutoff = Date.now() - state.burstWindowSec * 1000;
          const recent = trades.find(t => t.mint === mint && t.direction === direction &&
            new Date(t.at || t.updatedAt || 0).getTime() >= cutoff &&
            ['SUBMITTING','PENDING','CONFIRMED','UNCERTAIN','REVIEWED'].includes(t.status));
          if (recent) {
            return {
              at:nowIso(), alertId, name:token.name, mint, direction,
              status:'BURST_SUPPRESSED', reason:`Another $${direction} trade for this token was already attempted within $${state.burstWindowSec}s`,
              signature:null
            };
          }
        }
        if (activeTradeLock) throw new Error(`Global trade lock held by $${activeTradeLock.alertId}`);

        activeTradeLock = { alertId, mint, direction, since:nowIso() };
        const rec = {
          at:nowIso(), updatedAt:nowIso(), alertId, name:token.name, mint, direction,
          target, usdAmount, tokenAmount:direction==='SELL'?amountIn:null,
          effectivePrice:effective, wallet:tradeWallet, walletNickname:walletLabel(tradeWallet),
          priceImpactPercent:finalImpactPercent,maxPriceImpactPct:state.maxPriceImpactPct,
          quoteId, status:'SUBMITTING', signature:null
        };
        boundedPush(trades, rec, MAX_TRADES); saveTrades();
        const sourceResetMinutes=Number(finalToken.alert_reset_minutes??0);
        triggerGuards[triggerGuardKey(mint,direction,target)]={
          at:nowIso(),alertId,mint,direction,target,
          resetMinutes:Number.isFinite(sourceResetMinutes)&&sourceResetMinutes>=0?sourceResetMinutes:0
        };
        saveTriggerGuards();
        addAudit('TRADE_SUBMITTING',{alertId,mint,direction,target});

        try {
          const result = await gateway('/connectors/jupiter/router/execute-quote', {
            method:'POST', headers:{'content-type':'application/json'},
            body:JSON.stringify({walletAddress:tradeWallet,network:NETWORK,quoteId})
          }, 90000);

          rec.updatedAt=nowIso();
          rec.signature=isSolanaSignature(result?.signature)?String(result.signature):null;
          rec.gatewayStatus=result?.status;
          rec.data=result?.data || null;
          if (result?.status === 1 && rec.signature) {
            rec.status='CONFIRMED'; activeTradeLock=null; saveTrades();
            addAudit('TRADE_CONFIRMED',{alertId,signature:rec.signature});
            return rec;
          }
          if (result?.status === -1) {
            rec.status='FAILED'; activeTradeLock=null; saveTrades();
            addAudit('TRADE_FAILED',{alertId,signature:rec.signature});
            return rec;
          }

          if (rec.signature) {
            rec.status='PENDING'; saveTrades();
            for (let i=0;i<6;i++) {
              await sleep(5000);
              const poll = await gateway('/chains/solana/poll', {
                method:'POST', headers:{'content-type':'application/json'},
                body:JSON.stringify({network:NETWORK,signature:rec.signature})
              }, 15000);
              if (poll?.txStatus === 1) {
                rec.status='CONFIRMED'; rec.poll=poll; rec.updatedAt=nowIso(); activeTradeLock=null; saveTrades();
                addAudit('TRADE_CONFIRMED_AFTER_POLL',{alertId,signature:rec.signature}); return rec;
              }
              if (poll?.txStatus === -1) {
                rec.status='FAILED'; rec.poll=poll; rec.updatedAt=nowIso(); activeTradeLock=null; saveTrades();
                addAudit('TRADE_FAILED_AFTER_POLL',{alertId,signature:rec.signature}); return rec;
              }
            }
          }

          rec.status='UNCERTAIN'; rec.updatedAt=nowIso();
          state.safetyLock=true; state.safetyReason=`Transaction result uncertain for alert $${alertId}$${rec.signature ? ` / $${rec.signature}` : ''}`;
          state.master=false; saveState();
          saveTrades();
          addAudit('TRADE_UNCERTAIN',{alertId,signature:rec.signature});
          return rec;
        } catch (e) {
          rec.status='UNCERTAIN'; rec.error=e.message || String(e); rec.updatedAt=nowIso();
          state.safetyLock=true; state.safetyReason=`Execution request became uncertain for alert $${alertId}. Do not retry automatically.`;
          state.master=false; saveState();
          saveTrades();
          addAudit('TRADE_EXECUTION_ERROR_UNCERTAIN',{alertId,error:rec.error});
          return rec;
        }
      }

      const internal = http.createServer(async (req,res) => internalJson(req,res,async()=>{
        const u = new URL(req.url, 'http://internal');
        if (req.method==='GET' && u.pathname==='/healthz') return send(res,200,JSON.stringify({ok:true}),'application/json');
        if (req.method==='GET' && u.pathname==='/internal/source-state') {
          const app=await getApp();
          return send(res,200,JSON.stringify(app),'application/json');
        }
        if (req.method==='GET' && u.pathname==='/internal/state') {
          cleanOldHandoffs();
          return send(res,200,JSON.stringify({ok:true,state:safePublicState(),listener:{streamConnected,activeTopics,lastDecision,lastForwardedAt}}),'application/json');
        }
        if (req.method==='POST' && u.pathname==='/internal/claim') {
          const b=JSON.parse(await readBody(req) || '{}'); cleanOldHandoffs();
          const p=pendingHandoffs.get(String(b.id||''));
          const ok=!!p && p.token===String(b.handoff||'') && p.expires>=Date.now();
          if(ok){pendingHandoffs.delete(String(b.id));claimedHandoffs.set(String(b.id),{expires:Date.now()+10*60*1000});}
          return send(res,200,JSON.stringify({ok,claimed:ok}),'application/json');
        }
        if(req.method==='POST'&&u.pathname==='/internal/balances'){
          const b=JSON.parse(await readBody(req)||'{}');
          const mint=String(b.mint||''),name=String(b.name||'');
          const assignedWallet=state.tokens?.[mint]?.wallet||null;
          if(!assignedWallet)return send(res,200,JSON.stringify({assigned:false,configured:false,wallet:null,walletNickname:null,backupConfirmed:false,sol:null,usdc:null,token:null,raw:{},minSolReserve:state.minSolReserve}),'application/json');
          const wallets=solanaWalletAddresses(await getWallets());
          if(!wallets.includes(assignedWallet))return send(res,200,JSON.stringify({assigned:true,configured:false,wallet:assignedWallet,walletNickname:walletLabel(assignedWallet),backupConfirmed:state.walletBackups[assignedWallet]===true,error:'assigned wallet is not present in Gateway',sol:null,usdc:null,token:null,raw:{},minSolReserve:state.minSolReserve}),'application/json');
          const result=await getBalancesNormalized(assignedWallet,mint,name);
          return send(res,200,JSON.stringify({...result,assigned:true,walletNickname:walletLabel(assignedWallet),backupConfirmed:state.walletBackups[assignedWallet]===true,minSolReserve:state.minSolReserve}),'application/json');
        }
        if (req.method==='POST' && u.pathname==='/internal/trade/execute') {
          const b=JSON.parse(await readBody(req) || '{}');
          const result=await executeTrade(b);
          return send(res,200,JSON.stringify({ok:true,trade:result}),'application/json');
        }
        return send(res,404,JSON.stringify({ok:false,error:'not found'}),'application/json');
      }));

      function remember(id) {
        if (!id || seen.has(id)) return false;
        seen.add(id); seenList.push(id);
        if (seenList.length > MAX_SEEN) {
          const removed=seenList.splice(0,seenList.length-MAX_SEEN);
          for(const x of removed) seen.delete(x);
        }
        persistControllerJson(SEEN_FILE,seenList,'replay-event history'); return true;
      }
      async function listGatewayTokens(search=''){
        const qs=new URLSearchParams({chain:'solana',network:NETWORK});
        if(search)qs.set('search',search);
        const r=await gateway(`/tokens?$${qs.toString()}`,{},10000);
        return Array.isArray(r?.tokens)?r.tokens:[];
      }
      function gatewayInternalSymbol(mint){
        return `AUTO_$${mint.slice(0,8)}_$${mint.slice(-6)}`.toUpperCase();
      }
      async function ensureGatewayToken(appToken){
        const mint=String(appToken?.mint||'').trim();
        if(!isMint(mint))return {ok:false,mint,error:'invalid Solana mint'};
        if(gatewayTokenReadyMints.has(mint))return {ok:true,mint,cached:true};

        const existing=await listGatewayTokens(mint);
        const exact=existing.find(t=>String(t?.address||'')===mint);
        if(exact){gatewayTokenReadyMints.add(mint);return {ok:true,mint,token:exact,existing:true};}

        let discovered;
        try{
          discovered=await gateway(`/tokens/find/$${encodeURIComponent(mint)}?chainNetwork=$${encodeURIComponent(`solana-$${NETWORK}`)}`,{},15000);
        }catch(e){
          return {ok:false,mint,error:`Gateway token metadata lookup failed: $${e.message||e}`};
        }
        const decimals=Number(discovered?.decimals);
        if(!Number.isInteger(decimals)||decimals<0||decimals>255)return {ok:false,mint,error:'Gateway returned invalid token decimals'};

        const token={
          chainId:Number.isFinite(Number(discovered?.chainId))?Number(discovered.chainId):101,
          name:String(discovered?.name||appToken?.name||`Token $${mint.slice(0,8)}`).trim(),
          // Never key auto-managed tokens by a public ticker: duplicate meme-token symbols are common.
          symbol:gatewayInternalSymbol(mint),
          address:mint,
          decimals
        };

        try{
          await gateway('/tokens',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({chain:'solana',network:NETWORK,token})
          },15000);
        }catch(e){
          const after=await listGatewayTokens(mint).catch(()=>[]);
          if(!after.some(t=>String(t?.address||'')===mint))
            return {ok:false,mint,error:`Gateway token save failed: $${e.message||e}`};
        }

        const verify=await listGatewayTokens(mint);
        const saved=verify.find(t=>String(t?.address||'')===mint);
        if(!saved)return {ok:false,mint,error:'Gateway token save did not verify by exact mint'};
        gatewayTokenReadyMints.add(mint);
        addAudit('GATEWAY_TOKEN_AUTO_ADDED',{mint,appName:String(appToken?.name||''),gatewaySymbol:saved.symbol,decimals:saved.decimals});
        console.log('[gateway-token] auto-added',mint,saved.symbol,'decimals',saved.decimals);
        return {ok:true,mint,token:saved,added:true};
      }
      async function ensureGatewayTokensForApp(app){
        const enabled=(Array.isArray(app?.tokens)?app.tokens:[]).filter(t=>t?.enabled===true&&isMint(t?.mint));
        const results=[];
        for(const t of enabled){
          try{results.push({...await ensureGatewayToken(t),name:t.name});}
          catch(e){results.push({ok:false,mint:t.mint,name:t.name,error:e.message||String(e)});}
        }
        return {ok:results.every(r=>r.ok),total:results.length,ready:results.filter(r=>r.ok).length,
          failed:results.filter(r=>!r.ok),results};
      }
      async function prepareGatewayTokenForMessage(msg){
        // A public ntfy message may only cause token registration after matching a mint and
        // effective topic that are already present in Jupiter USDC Price Alerts.
        const text=String(msg?.message||'');
        const match=text.match(/^Token:\s*(.*?)\s+\(([1-9A-HJ-NP-Za-km-z]{32,44})\)\s*$$/m);
        if(!match)return {ok:true,skipped:true};
        const mint=String(match[2]);
        const app=await getApp();syncTokenControls(app);
        const token=(Array.isArray(app?.tokens)?app.tokens:[]).find(t=>t?.mint===mint);
        if(!token)return {ok:true,skipped:true};
        const sm=new Map((Array.isArray(app?.summaries)?app.summaries:[]).map(s=>[s.mint,s]));
        const summary=sm.get(mint)||{};
        const effectiveTopic=String(summary.ntfy_effective_topic||token.ntfy_topic||'');
        if(!effectiveTopic||String(msg?.topic||'')!==effectiveTopic)return {ok:true,skipped:true};
        return ensureGatewayToken(token);
      }

      async function getTopics() {
        const data=await getApp(); syncTokenControls(data);
        const tokenSync=await ensureGatewayTokensForApp(data);
        if(!tokenSync.ok)console.warn('[gateway-token] sync incomplete:',tokenSync.failed.map(x=>`$${x.name||x.mint}: $${x.error}`).join(' | '));
        const topics=[];
        for(const t of data.tokens||[]){
          if(t.enabled!==true||!isMint(t.mint)) continue;
          const topic=currentEffectiveTopic(data,t.mint).trim();
          if(topic) topics.push(topic);
        }
        return [...new Set(topics)].sort();
      }
      function sameArray(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}
      async function refreshTopicsLoop(){
        for(;;){
          try{
            const next=await getTopics();lastTopicRefreshAt=nowIso();lastError=null;
            if(!sameArray(next,desiredTopics)){desiredTopics=next;console.log('[ntfy] topic subscription count:',next.length);if(streamController)streamController.abort();}
          }catch(e){lastError=`topic refresh: $${e.message||e}`;console.error('[ntfy]',lastError);}
          await sleep(TOPIC_REFRESH_MS);
        }
      }
      async function forwardToN8n(msg){
        const handoff=crypto.randomBytes(32).toString('hex');
        pendingHandoffs.set(msg.id,{token:handoff,expires:Date.now()+5*60*1000});
        let tokenPrep={ok:true,skipped:true};
        try{tokenPrep=await prepareGatewayTokenForMessage(msg);}
        catch(e){tokenPrep={ok:false,error:e.message||String(e)};}
        const payload={...msg,_handoff:handoff,_gatewayTokenReady:tokenPrep.ok===true,
          _gatewayTokenError:tokenPrep.ok===true?null:(tokenPrep.error||'Gateway token preparation failed'),
          _tradingTopicReady:!state.requirePrivateTradingTopic || String(msg?.topic||'')===state.tradingNtfyTopic};
        // The controller can spend up to 90s awaiting execution and then poll a pending
        // signature. Keep this handoff longer than that complete bounded resolution path.
        const t=timeoutSignal(360000);
        let r;
        try {
          r=await fetch(N8N_WEBHOOK,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),signal:t.signal});
        } finally {
          t.clear();
        }
        const text=await r.text();
        if(!r.ok) throw new Error(`n8n HTTP $${r.status} $${text.slice(0,300)}`);
        let result;try{result=JSON.parse(text)}catch{result={raw:text.slice(0,500)}}
        lastForwardedAt=nowIso();lastForwardedId=msg.id;lastDecision=result?.decision||result?.trade?.status||result?.status||null;
        addAudit('NTFY_DECISION',{id:msg.id,topic:msg.topic,title:msg.title||'',decision:lastDecision});
        claimedHandoffs.delete(msg.id);pendingHandoffs.delete(msg.id);
        console.log('[ntfy] decision',msg.id,'=>',lastDecision||'OK');
      }
      async function streamLoop(){
        for(;;){
          if(!desiredTopics.length){activeTopics=[];streamConnected=false;await sleep(1000);continue;}
          const topics=[...desiredTopics], encoded=topics.map(encodeURIComponent).join(',');
          const controller=new AbortController();streamController=controller;activeTopics=topics;
          try{
            const r=await fetch(`$${NTFY}/$${encoded}/json?since=$${encodeURIComponent(LOOKBACK)}`,{signal:controller.signal});
            if(!r.ok)throw new Error(`ntfy HTTP $${r.status}`);
            streamConnected=true;lastError=null;reconnectDelay=1000;
            const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';
            while(true){
              const part=await reader.read();if(part.done)throw new Error('ntfy stream ended');
              buffer+=decoder.decode(part.value,{stream:true});let idx;
              while((idx=buffer.indexOf('\n'))>=0){
                const line=buffer.slice(0,idx).trim();buffer=buffer.slice(idx+1);if(!line)continue;
                let msg;try{msg=JSON.parse(line)}catch{continue}
                if(msg.event!=='message'||typeof msg.id!=='string'||!msg.id||msg.id.length>128||seen.has(msg.id))continue;
                addAudit('NTFY_RECEIVED',{id:msg.id,topic:msg.topic,title:msg.title||''});
                try{
                  await forwardToN8n(msg);
                  // Mark only after n8n returns a terminal decision. If delivery fails, reconnect + replay safely.
                  remember(msg.id);
                }catch(e){
                  lastError=`n8n handoff: $${e.message||e}`;
                  addAudit('NTFY_PROCESSING_ERROR',{id:msg.id,error:lastError});
                  console.error('[ntfy]',lastError);
                  throw e;
                }
              }
              if(buffer.length>1024*1024)throw new Error('ntfy stream line exceeded 1 MiB');
            }
          }catch(e){
            streamConnected=false;
            reconnectDelay=e?.name==='AbortError'?500:Math.min(Math.max(2000,reconnectDelay*2),15000);
            if(e?.name!=='AbortError'){lastError=`stream: $${e.message||e}`;console.error('[ntfy]',lastError);}
          }finally{if(streamController===controller)streamController=null;}
          await sleep(reconnectDelay);
        }
      }

      admin.listen(ADMIN_PORT,'0.0.0.0',()=>console.log(`[trading-controller] admin UI listening on $${ADMIN_PORT}`));
      internal.listen(INTERNAL_PORT,'0.0.0.0',()=>console.log(`[trading-controller] internal API listening on $${INTERNAL_PORT}`));
      console.log('[source-api] using',APP_API);
      refreshTopicsLoop();
      streamLoop().catch(e=>{console.error('[ntfy] fatal',e);process.exit(1)});
      setInterval(cleanOldHandoffs,60_000).unref();
    ports:
    - 5680:5680
    environment:
      APP_API_PORT: ${APP_API_PORT:-8000}
      APP_API_URL: ${APP_API_URL:-}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      N8N_ALERT_WEBHOOK: http://n8n:5678/webhook/jupiter-ntfy-event
      N8N_HEALTH_URL: http://n8n:5678/healthz
      GATEWAY_URL: http://gateway:15888
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      SOLANA_NETWORK: mainnet-beta
      TOPIC_REFRESH_SECONDS: '15'
      NTFY_LOOKBACK: 5m
      TZ: ${TZ:-Europe/London}
      RPC_CONFIGURATOR_URL: http://rpc-configurator:8081
      RPC_CONTROL_DIR: /gateway-control
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - type: volume
      source: controller_data
      target: /data
      volume:
        nocopy: true
    - type: volume
      source: gateway_control
      target: /gateway-control
      volume:
        nocopy: true
    depends_on:
      n8n:
        condition: service_healthy
      gateway:
        condition: service_healthy
      rpc-configurator:
        condition: service_healthy
      n8n-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:5680/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - trading_control
  gateway-init:
    image: hummingbot/gateway:version-2.15.1@sha256:674d441140f3becaeeb9ad0634cdc8c7b1b1268395b8dd9ee004bd63b15180f2
    restart: 'no'
    logging: *default-logging
    command:
    - sh
    - -c
    - |
      set -eu
      CONF=/home/gateway/conf
      ROOT="$$CONF/root.yml"

      if [ ! -e "$$ROOT" ]; then
        if [ -n "$$(find "$$CONF" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
          echo "[gateway-init] ERROR: configuration volume is non-empty but root.yml is missing; refusing to overwrite partial or restored data" >&2
          exit 10
        fi

        echo "[gateway-init] initialising fresh Gateway configuration"
        pnpm run setup:with-defaults
      fi

      for FILE in \
        "$$CONF/root.yml" \
        "$$CONF/server.yml" \
        "$$CONF/apiKeys.yml" \
        "$$CONF/chains/solana.yml" \
        "$$CONF/chains/solana/mainnet-beta.yml"
      do
        if [ ! -s "$$FILE" ]; then
          echo "[gateway-init] ERROR: required Gateway configuration is missing or empty: $$FILE" >&2
          exit 11
        fi
      done

      echo "[gateway-init] Gateway configuration is complete"
    volumes:
    - type: volume
      source: gateway_conf
      target: /home/gateway/conf
      volume:
        nocopy: true
    network_mode: none
  gateway:
    image: hummingbot/gateway:version-2.15.1@sha256:674d441140f3becaeeb9ad0634cdc8c7b1b1268395b8dd9ee004bd63b15180f2
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      GATEWAY_PASSPHRASE: ${GATEWAY_PASSPHRASE:?GATEWAY_PASSPHRASE is required and must remain stable}
      DEV: 'true'
    volumes:
    - type: volume
      source: gateway_conf
      target: /home/gateway/conf
      volume:
        nocopy: true
    - type: volume
      source: gateway_logs
      target: /home/gateway/logs
      volume:
        nocopy: true
    - type: volume
      source: gateway_control
      target: /gateway-control
      volume:
        nocopy: true
    depends_on:
      gateway-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:15888/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
    - trading_control
    init: true
    command:
    - sh
    - -c
    - |
      set -eu

      child=""
      pending_ack=""

      stop_child() {
        if [ -z "$$child" ]; then
          return 0
        fi

        if kill -0 "$$child" 2>/dev/null; then
          echo "[gateway-supervisor] stopping Gateway PID $$child"
          kill -TERM "$$child" 2>/dev/null || true

          i=0
          while kill -0 "$$child" 2>/dev/null && [ "$$i" -lt 12 ]; do
            sleep 1
            i=$$((i + 1))
          done

          if kill -0 "$$child" 2>/dev/null; then
            echo "[gateway-supervisor] Gateway did not stop after 12s; forcing stop"
            kill -KILL "$$child" 2>/dev/null || true
          fi

          wait "$$child" 2>/dev/null || true
        fi

        child=""
      }

      trap 'stop_child; exit 0' TERM INT

      while true; do
        if [ -f /gateway-control/restart.request ]; then
          pending_ack="$$(cat /gateway-control/restart.request 2>/dev/null || true)"
        fi

        # Track the real Node PID so RPC provider changes always create a fresh Solana instance.
        # --dev explicitly selects HTTP; DEV=true is only interpreted by the image's default command,
        # which this supervisor intentionally replaces.
        START_SERVER=true node dist/index.js --dev &
        child=$$!
        echo "[gateway-supervisor] Gateway started as PID $$child"

        if [ -n "$$pending_ack" ]; then
          printf '%s' "$$pending_ack" > /gateway-control/restart.ack.tmp
          mv -f /gateway-control/restart.ack.tmp /gateway-control/restart.ack
          rm -f /gateway-control/restart.request
          pending_ack=""
        fi

        restart_requested=0

        while kill -0 "$$child" 2>/dev/null; do
          if [ -f /gateway-control/restart.request ]; then
            pending_ack="$$(cat /gateway-control/restart.request 2>/dev/null || true)"
            echo "[gateway-supervisor] RPC/config restart requested"
            restart_requested=1
            stop_child
            break
          fi
          sleep 1
        done

        if [ -n "$$child" ]; then
          wait "$$child" 2>/dev/null || true
          child=""
        fi

        if [ "$$restart_requested" -eq 1 ]; then
          echo "[gateway-supervisor] restarting Gateway with fresh configuration"
        else
          echo "[gateway-supervisor] Gateway exited; restarting"
        fi

        sleep 2
      done
  rpc-configurator:
    image: hummingbot/gateway:version-2.15.1@sha256:674d441140f3becaeeb9ad0634cdc8c7b1b1268395b8dd9ee004bd63b15180f2
    restart: unless-stopped
    logging: *default-logging
    extra_hosts:
    - host.docker.internal:host-gateway
    init: true
    entrypoint:
    - node
    - -e
    command:
    - |
      const http=require('http');
      const fs=require('fs');
      const crypto=require('crypto');
      const yaml=require('js-yaml');
      const {URL}=require('url');

      const PORT=8081;
      const CONF='/gateway-conf';
      const CONTROL='/gateway-control';
      const TOKEN_FILE=`$${CONTROL}/rpc-config-token`;
      const PUBLIC_RPC='https://api.mainnet-beta.solana.com';
      const MAINNET_GENESIS_HASH='5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d';
      const API_KEYS=`$${CONF}/apiKeys.yml`;
      const SOLANA_CHAIN=`$${CONF}/chains/solana.yml`;
      const SOLANA_MAINNET=`$${CONF}/chains/solana/mainnet-beta.yml`;

      function atomicText(path,value){
        const tmp=`$${path}.tmp`;
        fs.writeFileSync(tmp,String(value),{mode:0o600});
        fs.renameSync(tmp,path);
      }
      fs.mkdirSync(CONTROL,{recursive:true});
      if(!fs.existsSync(TOKEN_FILE)){
        atomicText(TOKEN_FILE,crypto.randomBytes(32).toString('hex'));
      }
      const accessToken=fs.readFileSync(TOKEN_FILE,'utf8').trim();
      if(!/^[a-f0-9]{64}$$/.test(accessToken))
        throw new Error('Persisted RPC-control token is invalid; restore a known-good gateway_control backup');

      function readYaml(path){
        try{return yaml.load(fs.readFileSync(path,'utf8'))||{};}catch(e){throw new Error(`Cannot read $${path}: $${e.message}`);}
      }
      function atomicYaml(path,value){
        const tmp=`$${path}.rpc-tmp`;
        fs.writeFileSync(tmp,yaml.dump(value,{lineWidth:120,noRefs:true}),{mode:0o600});
        fs.renameSync(tmp,path);
      }
      function send(res,code,obj){
        res.writeHead(code,{'content-type':'application/json','cache-control':'no-store','x-content-type-options':'nosniff'});
        res.end(JSON.stringify(obj));
      }
      function authorised(req){
        const h=String(req.headers.authorization||'');
        const expected=`Bearer $${accessToken}`;
        if(h.length!==expected.length)return false;
        try{return crypto.timingSafeEqual(Buffer.from(h),Buffer.from(expected));}catch{return false;}
      }
      async function body(req,max=64*1024){
        let s='';
        for await(const c of req){s+=c;if(s.length>max)throw new Error('request too large');}
        return s?JSON.parse(s):{};
      }
      function redactUrl(raw){
        try{
          const u=new URL(String(raw||''));
          if(u.username)u.username='***';
          if(u.password)u.password='***';
          if(u.pathname&&u.pathname!=='/')u.pathname='/***';
          if([...u.searchParams.keys()].length){
            for(const k of [...u.searchParams.keys()])u.searchParams.set(k,'***');
          }
          return u.toString();
        }catch{return raw?'configured':'—';}
      }
      function validateRpcUrl(raw){
        const u=new URL(String(raw||'').trim());
        if(!['http:','https:'].includes(u.protocol))throw new Error('RPC URL must use http:// or https://');
        if(!u.hostname)throw new Error('RPC URL hostname is missing');
        return u.toString();
      }
      function rpcUrlFingerprint(raw){
        const u=new URL(String(raw||''));
        u.hash='';
        u.searchParams.sort();
        return crypto.createHash('sha256').update(u.toString()).digest('hex');
      }
      function requestGatewayRestart(rpcUrl){
        const requestId=crypto.randomBytes(16).toString('hex');
        try{fs.unlinkSync(`$${CONTROL}/restart.ack`);}catch(e){if(e?.code!=='ENOENT')throw e;}
        atomicText(`$${CONTROL}/restart.request`,requestId);
        return {requestId,rpcUrlHash:rpcUrlFingerprint(rpcUrl)};
      }
      async function testSolanaRpc(url){
        const c=new AbortController();
        const timer=setTimeout(()=>c.abort(),20000);
        try{
          const call=async(method,params=[])=>{
            const r=await fetch(url,{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({jsonrpc:'2.0',id:method,method,params}),
              signal:c.signal
            });
            const j=await r.json().catch(()=>null);
            if(!r.ok)throw new Error(`RPC HTTP $${r.status} while calling $${method}`);
            if(j?.error)throw new Error(j.error.message||`RPC $${method} failed`);
            return j?.result;
          };
          const genesisHash=String(await call('getGenesisHash')||'');
          if(genesisHash!==MAINNET_GENESIS_HASH)
            throw new Error(`RPC is not Solana mainnet-beta (unexpected genesis hash $${genesisHash||'missing'})`);
          const latest=await call('getLatestBlockhash',[{commitment:'confirmed'}]);
          const blockhash=String(latest?.value?.blockhash||'');
          const slot=latest?.context?.slot;
          if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$$/.test(blockhash)||!Number.isSafeInteger(slot)||slot<0)
            throw new Error('RPC did not return a valid confirmed mainnet-beta blockhash response');
          return {slot,genesisHash};
        }finally{clearTimeout(timer);}
      }
      function currentStatus(){
        const keys=readYaml(API_KEYS);
        const sol=readYaml(SOLANA_CHAIN);
        const net=readYaml(SOLANA_MAINNET);
        const configuredProvider=String(sol.rpcProvider||'url');
        const nodeURL=String(net.nodeURL||PUBLIC_RPC);
        let provider='custom';
        if(configuredProvider==='helius')provider='helius';
        else if(nodeURL.replace(/\/+$$/,'')===PUBLIC_RPC)provider='public';
        return {
          provider,
          configuredProvider,
          nodeURLRedacted:redactUrl(nodeURL),
          heliusKeyConfigured:typeof keys.helius==='string'&&keys.helius.trim().length>0
        };
      }
      async function applyRpc(input){
        const provider=String(input.provider||'').trim().toLowerCase();
        if(!['public','helius','custom'].includes(provider))throw new Error('Unknown RPC provider');

        const keys=readYaml(API_KEYS);
        const sol=readYaml(SOLANA_CHAIN);
        const net=readYaml(SOLANA_MAINNET);

        let testUrl;
        if(provider==='public'){
          testUrl=PUBLIC_RPC;
        }else if(provider==='helius'){
          const supplied=String(input.heliusApiKey||'').trim();
          const existing=String(keys.helius||'').trim();
          const apiKey=supplied||existing;
          if(!/^[-_A-Za-z0-9]{8,200}$$/.test(apiKey))
            throw new Error('Enter a valid Helius API key (letters, numbers, hyphens, or underscores) or keep the already configured key');
          testUrl=`https://mainnet.helius-rpc.com/?api-key=$${encodeURIComponent(apiKey)}`;
          const result=await testSolanaRpc(testUrl);
          keys.helius=apiKey;
          sol.rpcProvider='helius';
          // Write the secret directly to Gateway config. Do NOT use Gateway /config/update,
          // because v2.15.1 logs config update values.
          atomicYaml(API_KEYS,keys);
          atomicYaml(SOLANA_CHAIN,sol);
          const restart=requestGatewayRestart(testUrl);
          return {provider:'helius',tested:true,slot:result.slot,endpoint:'https://mainnet.helius-rpc.com/?api-key=***',...restart};
        }else{
          testUrl=validateRpcUrl(input.customRpcUrl);
          if(new URL(testUrl).hostname.toLowerCase().replace(/\.+$$/,'')==='api.mainnet-beta.solana.com')
            throw new Error('Choose Solana Public for the official public endpoint; it is Testing-only and cannot satisfy Trading readiness');
        }

        const result=await testSolanaRpc(testUrl);
        sol.rpcProvider='url';
        net.nodeURL=testUrl;
        atomicYaml(SOLANA_CHAIN,sol);
        atomicYaml(SOLANA_MAINNET,net);
        const restart=requestGatewayRestart(testUrl);
        return {provider,tested:true,slot:result.slot,endpoint:redactUrl(testUrl),...restart};
      }

      let applyInProgress=false;
      const server=http.createServer(async(req,res)=>{
        try{
          if(req.url==='/healthz')return send(res,200,{ok:true});
          if(!authorised(req))return send(res,401,{ok:false,error:'unauthorised'});
          if(req.method==='GET'&&req.url==='/status')return send(res,200,{ok:true,...currentStatus()});
          if(req.method==='POST'&&req.url==='/apply'){
            if(applyInProgress)return send(res,409,{ok:false,error:'RPC provider change already in progress'});
            applyInProgress=true;
            try{
              const input=await body(req);
              const result=await applyRpc(input);
              return send(res,200,{ok:true,...result});
            }finally{applyInProgress=false;}
          }
          return send(res,404,{ok:false,error:'not found'});
        }catch(e){
          return send(res,400,{ok:false,error:e.message||String(e)});
        }
      });
      server.listen(PORT,'0.0.0.0',()=>console.log(`[rpc-configurator] internal service ready on $${PORT}`));
    volumes:
    - type: volume
      source: gateway_conf
      target: /gateway-conf
      volume:
        nocopy: true
    - type: volume
      source: gateway_control
      target: /gateway-control
      volume:
        nocopy: true
    depends_on:
      gateway-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
    - trading_control
  n8n-permissions:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: 'no'
    logging: *default-logging
    user: 0:0
    command:
    - sh
    - -c
    - mkdir -p /n8n-data /bootstrap && chown -R 1000:1000 /n8n-data /bootstrap && chmod -R u+rwX /n8n-data /bootstrap
    volumes:
    - type: volume
      source: n8n_data
      target: /n8n-data
      volume:
        nocopy: true
    - type: volume
      source: bootstrap_data
      target: /bootstrap
      volume:
        nocopy: true
    network_mode: none
  n8n-bootstrap:
    image: docker.n8n.io/n8nio/n8n:2.31.6@sha256:3c07c723326dd72e46a6969181c66a75260b7a204b9b77ba1ece6d594489c684
    restart: 'no'
    logging: *default-logging
    entrypoint:
    - /bin/sh
    - -c
    command:
    - |
      set -eu

      EXPECTED_HASH="d9cdd129533546d7c0ab4178eb9cb8a4dd517f55da5be43be930b43c5a677848"
      WORKFLOW_ID="JATCommunity1022"
      MARKER="/bootstrap/workflow.sha256"
      VERIFY="/tmp/published-verify.json"

      is_published() {
        rm -f "$$VERIFY"
        if n8n export:workflow --id="$$WORKFLOW_ID" --published --output="$$VERIFY" >/tmp/jat-export-published.log 2>&1; then
          node -e '
            const fs=require("fs");
            const p=process.argv[1];
            const id=process.argv[2];
            const w=JSON.parse(fs.readFileSync(p,"utf8"));
            const a=Array.isArray(w)?w:[w];
            const ok=a.some(x=>x && x.id===id && Array.isArray(x.nodes) &&
              x.nodes.some(n=>n?.type==="n8n-nodes-base.webhook" && n?.parameters?.path==="jupiter-ntfy-event"));
            process.exit(ok?0:1);
          ' "$$VERIFY" "$$WORKFLOW_ID"
          return $$?
        fi
        return 1
      }

      if [ -f "$$MARKER" ] && [ "$$(cat "$$MARKER" 2>/dev/null || true)" = "$$EXPECTED_HASH" ]; then
        if is_published; then
          echo "[n8n-bootstrap] workflow already installed and published; nothing to do"
          exit 0
        fi
        echo "[n8n-bootstrap] marker exists but published workflow is missing/stale; repairing"
      fi

      echo "[n8n-bootstrap] decoding and deterministically preparing embedded workflow template"
      node -e '
        const fs=require("fs"),crypto=require("crypto");
        const expected=process.argv[1];
        const w=JSON.parse(Buffer.from(process.env.JAT_WORKFLOW_B64,"base64").toString("utf8"));
        w.name="Jupiter Auto Trader v10.2.2 - Community Internal";
        w.id="JATCommunity1022";
        const sourceNodes=new Set(["Get Jupiter App State","BUY Final App State","SELL Final App State"]);
        for(const n of w.nodes||[]){
          if(sourceNodes.has(n?.name))n.parameters.url="http://trading-controller:8080/internal/source-state";
          if(n?.name==="Architecture / Safety"){
            n.parameters.content=[
              "## Jupiter USDC Auto Trader v10.2.2",
              "Controller: **http://<server>:5680**",
              "",
              "First public release. Safe defaults: TESTING, MASTER OFF, new token automation OFF, no wallet assignment, and public RPC for testing only. The dashboard supports Helius or a custom Solana RPC for Testing and Trading.",
              "",
              "Execution safety: exact mint, topic, and target validation; repeated Gateway target and price-impact checks; maximum USDC cap; per-token wallet assignment; live balances and SOL reserve; final executable quote; global trade lock; trigger guards; and uncertain-transaction lockout.",
              "",
              "BUY and SELL execution expressions include the required n8n parser-safe object spacing and are verified by the release checks."
            ].join("\n");
          }
        }
        const data=Buffer.from(JSON.stringify(w));
        const actual=crypto.createHash("sha256").update(data).digest("hex");
        if(actual!==expected){
          console.error("[n8n-bootstrap] generated workflow hash mismatch: expected "+expected+" got "+actual);
          process.exit(3);
        }
        fs.writeFileSync("/tmp/jat-workflow.json",data);
      ' "$$EXPECTED_HASH"

      echo "[n8n-bootstrap] checking for controlled Jupiter Auto Trader workflows"
      rm -f /tmp/existing-workflows.json
      n8n export:workflow --all --output=/tmp/existing-workflows.json >/tmp/jat-export-all.log 2>&1 || true

      if [ -s /tmp/existing-workflows.json ]; then
        MATCH_IDS="$$(node -e '
          const fs=require("fs");
          const raw=JSON.parse(fs.readFileSync("/tmp/existing-workflows.json","utf8"));
          const arr=Array.isArray(raw)?raw:[raw];
          const ids=[];
          for(const w of arr){
            if(!w?.id) continue;
            const ours=String(w.name||"").startsWith("Jupiter Auto Trader") ||
              (Array.isArray(w.nodes) && w.nodes.some(n=>n?.type==="n8n-nodes-base.webhook" &&
                n?.parameters?.path==="jupiter-ntfy-event"));
            if(ours) ids.push(w.id);
          }
          process.stdout.write(ids.join(" "));
        ')"

        for ID in $$MATCH_IDS; do
          echo "[n8n-bootstrap] unpublishing previous workflow $$ID before replacement"
          n8n unpublish:workflow --id="$$ID" >/tmp/jat-unpublish.log 2>&1 || true
        done
      fi

      echo "[n8n-bootstrap] importing fixed community workflow $$WORKFLOW_ID"
      n8n import:workflow --input=/tmp/jat-workflow.json

      echo "[n8n-bootstrap] verifying imported workflow ID"
      rm -f /tmp/imported-verify.json
      n8n export:workflow --id="$$WORKFLOW_ID" --output=/tmp/imported-verify.json
      node -e '
        const fs=require("fs");
        const p=process.argv[1],id=process.argv[2];
        const w=JSON.parse(fs.readFileSync(p,"utf8"));
        const a=Array.isArray(w)?w:[w];
        if(!a.some(x=>x?.id===id)) process.exit(2);
      ' /tmp/imported-verify.json "$$WORKFLOW_ID"

      echo "[n8n-bootstrap] publishing workflow"
      n8n publish:workflow --id="$$WORKFLOW_ID"

      if ! is_published; then
        echo "[n8n-bootstrap] ERROR: publish verification failed" >&2
        exit 20
      fi

      rm -f /bootstrap/restart.ack
      printf '%s' "$$EXPECTED_HASH" > /bootstrap/restart.request

      echo "[n8n-bootstrap] waiting for n8n supervisor restart acknowledgement"
      i=0
      while [ "$$i" -lt 90 ]; do
        ACK="$$(cat /bootstrap/restart.ack 2>/dev/null || true)"
        if [ "$$ACK" = "$$EXPECTED_HASH" ]; then
          break
        fi
        sleep 1
        i=$$((i + 1))
      done
      if [ "$$i" -ge 90 ]; then
        echo "[n8n-bootstrap] ERROR: n8n restart acknowledgement timed out" >&2
        exit 21
      fi

      echo "[n8n-bootstrap] waiting for restarted n8n health"
      i=0
      while [ "$$i" -lt 90 ]; do
        if node -e 'fetch("http://n8n:5678/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
          echo "[n8n-bootstrap] workflow installed, published and active after restart"
          printf '%s' "$$EXPECTED_HASH" > "$$MARKER"
          exit 0
        fi
        sleep 1
        i=$$((i + 1))
      done

      echo "[n8n-bootstrap] ERROR: restarted n8n did not become healthy" >&2
      exit 22
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required and must remain stable}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required and must remain stable}
      GENERIC_TIMEZONE: ${TZ:-Europe/London}
      TZ: ${TZ:-Europe/London}
      JAT_WORKFLOW_B64: 
    volumes:
    - type: volume
      source: n8n_data
      target: /home/node/.n8n
      volume:
        nocopy: true
    - type: volume
      source: bootstrap_data
      target: /bootstrap
      volume:
        nocopy: true
    depends_on:
      n8n:
        condition: service_healthy
    networks:
    - n8n_db
    - trading_control
networks:
  n8n_db:
    driver: bridge
  n8n_runners:
    driver: bridge
  trading_control:
    driver: bridge
volumes:
  postgres_data:
  n8n_data:
  bootstrap_data:
  controller_data:
  gateway_control:
  gateway_conf:
  gateway_logs:
